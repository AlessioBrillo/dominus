name: Benchmarks

on:
  push:
    branches: [master]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.bench.ts'
      - 'vitest.config.ts'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  benchmark:
    name: Bench (Node ${{ matrix.node }}, workload ${{ matrix.workload }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # Node 22 (LTS) and 24 (current) match the supported runtime
        # baseline of the CI matrix; Node 20 reached EOL on 2026-04-30 and
        # the current undici is incompatible with its webidl internals.
        node: [22, 24]
        workload: [100, 1000]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: node_modules
          key: deps-bench-${{ matrix.node }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-bench-${{ matrix.node }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run benchmarks
        run: npm run bench:ci
        env:
          BENCH_WORKLOAD_SIZE: ${{ matrix.workload }}

      - name: Store benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ matrix.node }}-${{ matrix.workload }}
          path: bench-results.json
          retention-days: 90

      - name: Compare with baseline (primary only)
        if: matrix.node == '22' && matrix.workload == '1000'
        run: |
          echo "Benchmark run complete for Node ${{ matrix.node }} / workload ${{ matrix.workload }}"
          echo "JSON report written by Vitest 4 benchmark.outputJson."
          echo "Inspect group means with:"
          echo "  jq -c '.files[] | .groups[] | {title, min: ([.benchmarks[].min] | min)}' bench-results.json"
