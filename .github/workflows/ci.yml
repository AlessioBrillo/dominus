name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        # Node 22 (LTS) and 24 (current) are the supported runtime baseline
        # (engines >= 22); Node 20 reached EOL on 2026-04-30 and is dropped.
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: windows-latest, node: 24 }
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 has no win32 prebuild for every Node ABI; when a
      # prebuild is missing node-gyp falls back to compiling from source,
      # which needs a working MSVC environment (the runner's VS detection
      # is unreliable on windows-latest).
      - name: Set up MSVC build tools (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Migration sync check
        run: npm run db:sync:check

      - name: Native bindings load check
        shell: bash
        run: |
          set -euo pipefail
          node -e "const db = require('better-sqlite3')(':memory:'); db.exec('CREATE TABLE t (a)'); console.log('better-sqlite3 OK')"
          node -e "const sharp = require('sharp'); console.log('sharp OK', sharp.versions.sharp)"

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Migration roundtrip verification (SQLite -> PG -> SQLite)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dominus
        run: |
          set -euo pipefail
          # Start PostgreSQL for roundtrip test
          docker run -d --name dominus-pg-roundtrip \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=dominus \
            -p 5432:5432 postgres:16-alpine
          # Wait for PG to be ready
          for i in $(seq 1 30); do
            if docker exec dominus-pg-roundtrip pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          # Run migrations on PG (RLS migration skipped via SKIP_RLS_MIGRATION)
          SKIP_RLS_MIGRATION=true DATABASE_URL=postgresql://postgres:postgres@localhost:5432/dominus npx tsx dist/db/migrate-cli.js
          # Create a test SQLite DB with some data
          sqlite_db="$(mktemp -d)/roundtrip.db"
          DATABASE_PATH="$sqlite_db" npx tsx dist/db/migrate-cli.js
          # Run roundtrip verification
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/dominus \
            npx tsx scripts/migrate-sqlite-to-pg.ts verify-roundtrip "$sqlite_db"
          # Cleanup
          docker rm -f dominus-pg-roundtrip >/dev/null

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  docker-smoke:
    name: Docker runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          load: true
          tags: dominus-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build-only validation of the remaining runtime targets so a broken
      # Dockerfile stage (worker/scheduler) fails the PR, not the deploy.
      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          load: false
          tags: dominus-worker:test
          cache-from: type=gha

      - name: Build scheduler image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: scheduler
          load: false
          tags: dominus-scheduler:test
          cache-from: type=gha

      - name: Smoke test — native binding + health endpoint
        env:
          SMOKE_CONTAINER: dominus-smoke
          DNS_TERTIARY_ENABLED: "false"
          DNS_CONSENSUS_ENABLED: "false"
        run: |
          set -euo pipefail

          # 1. The better-sqlite3 native binding must load inside the image.
          docker run --rm --entrypoint node dominus-api:test \
            -e "const db = require('better-sqlite3')(':memory:'); db.exec('CREATE TABLE t (a)'); console.log('better-sqlite3 OK')"

          # 2. The migrate CLI (ADR-0061) must be packaged and work inside
          #    the image: a fresh SQLite database at /tmp must be migrated
          #    to the full manifest (a bare run applies migrations, exit 0
          #    — the deploy invocation shape), and unknown arguments must
          #    be refused with usage (exit 2).
          docker run --rm --entrypoint node dominus-api:test \
            dist/db/migrate-cli.js --help >/dev/null
          migrate_out=$(docker run --rm -e DATABASE_PATH=/tmp/migrate-smoke.db \
            --entrypoint node dominus-api:test dist/db/migrate-cli.js)
          echo "$migrate_out"
          grep -q "migrations applied: 55" <<<"$migrate_out" || {
            echo "FATAL: migrate CLI must migrate a fresh SQLite database to the full manifest inside the image"
            exit 1
          }
          set +e
          docker run --rm --entrypoint node dominus-api:test \
            dist/db/migrate-cli.js --bogus >/dev/null 2>&1
          usage_rc=$?
          set -e
          [ "$usage_rc" -eq 2 ] || {
            echo "FATAL: migrate CLI unknown arguments must exit 2 inside the image, got $usage_rc"
            exit 1
          }

          # 3. The API must boot and answer /api/health (unauthenticated).
          #    DATABASE_PATH points at /tmp so no volume is needed and the
          #    non-root user can write. HOST must be 0.0.0.0 for the
          #    published port to forward, which requires API_KEYS or the
          #    app aborts with a security fatal at startup.
          #    Disable DNS consensus/tertiary for smoke test (CI lacks disjoint resolvers).
          docker run -d --name "$SMOKE_CONTAINER" -p 3000:3000 \
            -e DATABASE_PATH=/tmp/dominus.db \
            -e HOST=0.0.0.0 \
            -e API_KEYS=smoke-test-key \
            -e DNS_CONSENSUS_ENABLED=false \
            -e DNS_TERTIARY_ENABLED=false \
            -e DNS_CONSENSUS_ON_FAILURE=disable \
            dominus-api:test

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "healthcheck OK (attempt $i)"
              docker rm -f "$SMOKE_CONTAINER" >/dev/null
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx "$SMOKE_CONTAINER"; then
              echo "container exited — dumping logs" >&2
              docker logs "$SMOKE_CONTAINER" >&2 || true
              docker rm -f "$SMOKE_CONTAINER" >/dev/null
              exit 1
            fi
            sleep 2
          done

          echo "healthcheck never succeeded" >&2
          docker logs "$SMOKE_CONTAINER" >&2 || true
          docker rm -f "$SMOKE_CONTAINER" >/dev/null
          exit 1

  compose-config:
    name: Compose topology & monitoring config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-test-password
      # GRAFANA_ADMIN_PASSWORD is required by the prod overlay (no
      # admin/admin defaults); provide a placeholder so topology
      # validation can interpolate the merged config.
      GRAFANA_ADMIN_PASSWORD: ci-test-password
      # DOMINUS_IMAGE_TAG is required (ADR-0046): a stable release tag is
      # enough for topology validation; the pinned-digest existence check
      # below validates the immutable refs against the registry.
      DOMINUS_IMAGE_TAG: v1.0.0

    steps:
      - uses: actions/checkout@v7

      # The base compose file must start the full app by default
      # (api + worker + scheduler) and must NOT define the Cloud data
      # stores — postgres/redis live in the production overlay so the
      # community edition never pulls them.
      - name: Validate base compose config
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          services=$(docker compose -f docker-compose.yml config --services)
          for expected in api worker scheduler; do
            grep -qx "$expected" <<<"$services" || {
              echo "FATAL: base compose is missing service '$expected'"; exit 1
            }
          done
          if echo "$services" | grep -qx postgres || echo "$services" | grep -qx redis; then
            echo "FATAL: postgres/redis must not be in the base compose file"
            exit 1
          fi

      # The merged production profile must start the full Cloud stack — this
      # guards the regression where the documented prod command silently ran
      # api-only because worker/scheduler/postgres/redis were profile-gated.
      - name: Validate merged production compose config
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          services=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --services)
          for expected in api worker scheduler postgres redis redis-exporter prometheus alertmanager grafana; do
            echo "$services" | grep -qx "$expected" || {
              echo "FATAL: prod compose is missing service '$expected'"; exit 1
            }
          done

      # The optional DNS-consensus override (ADR-0042) must merge cleanly on
      # top of the prod profile and pin the recursor to its fixed address.
      - name: Validate DNS-consensus override compose config
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.dns-consensus.yml config --quiet
          services=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.dns-consensus.yml config --services)
          for expected in api worker scheduler postgres redis consensus-dns; do
            echo "$services" | grep -qx "$expected" || {
              echo "FATAL: dns-consensus override is missing service '$expected'"; exit 1
            }
          done
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.dns-consensus.yml config --format json \
            | grep -q '"172.20.0.10"' || {
              echo "FATAL: consensus-dns must be pinned to 172.20.0.10"; exit 1
            }
          # The app services must receive the pinned recursor and the enabled
          # gate — otherwise the override is documented-only and silently
          # inert (ADR-0042 regression guard). jq checks per-service env.
          MERGED_JSON=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            -f docker-compose.dns-consensus.yml config --format json)
          for svc in api worker scheduler; do
            echo "$MERGED_JSON" | jq -e \
              ".services.$svc.environment[\"DNS_CONSENSUS_NAMESERVERS\"] == \"172.20.0.10:5300\"" >/dev/null || {
                echo "FATAL: service '$svc' must set DNS_CONSENSUS_NAMESERVERS=172.20.0.10:5300"; exit 1
              }
            echo "$MERGED_JSON" | jq -e \
              ".services.$svc.environment[\"DNS_CONSENSUS_ENABLED\"] == \"true\"" >/dev/null || {
                echo "FATAL: service '$svc' must enable DNS_CONSENSUS_ENABLED=true"; exit 1
              }
            # Native leg pin: the primary resolver must also use the private
            # recursor, never Docker's embedded DNS / host resolv.conf.
            echo "$MERGED_JSON" | jq -e \
              ".services.$svc.environment[\"DNS_NAMESERVERS\"] == \"172.20.0.10:5300\"" >/dev/null || {
                echo "FATAL: service '$svc' must set DNS_NAMESERVERS=172.20.0.10:5300 (native leg pin)"; exit 1
              }
          done

      - name: Validate Prometheus config and rules
        run: |
          set -euo pipefail
          # prom/prometheus ENTRYPOINT is the prometheus binary, so promtool
          # must be set via --entrypoint, not appended as a command.
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.53.1@sha256:f20d3127bf2876f4a1df76246fca576b41ddf1125ed1c546fbd8b16ea55117e6 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.53.1@sha256:f20d3127bf2876f4a1df76246fca576b41ddf1125ed1c546fbd8b16ea55117e6 check rules /etc/prometheus/rules.yml

      - name: Validate Alertmanager config
        run: |
          set -euo pipefail
          # Same entrypoint caveat as promtool: override to run amtool directly.
          docker run --rm --entrypoint amtool -v "$PWD/deploy/prometheus:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5 check-config /etc/alertmanager/alertmanager.yml

      # ADR-0046: a digest-pinned reference to a nonexistent image is still a
      # broken rollout (the original nlnetlabs/unbound recursor reference was
      # exactly that). Verify every pinned external image actually exists in
      # its registry before the PR can merge.
      - name: Verify pinned image digests exist in registry
        run: |
          set -euo pipefail
          refs=$(grep -hoE 'image: [^ ]+@sha256:[0-9a-f]{64}' \
            docker-compose.prod.yml docker-compose.dns-consensus.yml | awk '{print $2}' | sort -u)
          for ref in $refs; do
            docker buildx imagetools inspect "$ref" >/dev/null 2>&1 || {
              echo "FATAL: pinned image not found in registry: $ref"; exit 1
            }
            echo "OK: $ref"
          done

  image-pins:
    name: Immutable image pins (ADR-0046)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check every image reference is pinned
        run: npm run check:image-pins

  deploy-script:
    name: Deploy rollout script check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # The rollout script runs on the app node during release deploys; a
      # syntax error there fails the deploy at the worst moment, so CI
      # validates it on every PR (same guard as the compose-topology job).
      # The migrate-before-roll step (ADR-0061) is part of the same path.
      - name: Syntax-check rollout and migrate scripts
        run: |
          bash -n scripts/deploy/rollout.sh
          bash -n scripts/deploy/migrate.sh
          bash -n scripts/deploy/test-migrate.sh

      - name: Behavior-test rollout script (mocked docker/curl)
        run: bash scripts/deploy/test-rollout.sh

      - name: Behavior-test migrate script (mocked docker)
        run: bash scripts/deploy/test-migrate.sh

  release-gate:
    name: Release gate (schema migration safety)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The migration gate is part of the rollout path: syntax errors in
      # any of the deploy scripts fail the PR, not the release.
      - name: Syntax-check migration gate and deploy scripts
        run: |
          set -euo pipefail
          bash -n scripts/deploy/migration-gate.sh
          bash -n scripts/deploy/rollout.sh
          bash -n scripts/deploy/migrate.sh
          bash -n scripts/deploy/test-migration-gate.sh
          bash -n scripts/deploy/test-rollout.sh
          bash -n scripts/deploy/test-migrate.sh

      # Destructive DDL is refused on every migration (drop/rename columns,
      # drop tables without recreate, deletes, SET NOT NULL). The fixture
      # suite proves the scanner's judgement and scans the real repo.
      - name: Check migrations are additive (fixture suite + repo scan)
        run: node scripts/check-migration-compat.mjs --test

      - name: Behavior-test migration gate (mocked docker/psql)
        run: bash scripts/deploy/test-migration-gate.sh

      - name: Behavior-test rollout with gate wired in
        run: bash scripts/deploy/test-rollout.sh

      # The built image must expose the manifest CLI the gate invokes via
      # `docker run --entrypoint node`; assert it builds and lists the same
      # migrations the registry knows. The migrate CLI (migrate-before-roll,
      # ADR-0061) is smoke-tested end-to-end: a fresh SQLite database must
      # be migrated to the full manifest (a bare run applies migrations,
      # exit 0 — the deploy invocation shape) and unknown arguments must be
      # refused with usage (exit 2).
      - name: Build and smoke-test migration manifest and migrate CLIs
        run: |
          set -euo pipefail
          npm run build
          list_count=$(node dist/db/migration-manifest-cli.js --list | wc -l)
          registry_count=$(node --input-type=module -e "
            import('./dist/db/migrations/registry.js').then(m => {
              process.stdout.write(String(m.getMigrationNames().length));
            })
          ")
          [ "$list_count" = "$registry_count" ] || {
            echo "FATAL: manifest CLI lists $list_count migrations, registry knows $registry_count"
            exit 1
          }
          echo "migration manifest CLI OK ($list_count migrations)"
          node dist/db/migrate-cli.js --help >/dev/null
          smoke_db="$(mktemp -d)/smoke.db"
          migrate_out=$(DATABASE_PATH="$smoke_db" node dist/db/migrate-cli.js)
          echo "$migrate_out"
          grep -q "migrations applied: $list_count" <<<"$migrate_out" || {
            echo "FATAL: fresh database must migrate to the full manifest ($list_count migrations)"
            exit 1
          }
          set +e
          node dist/db/migrate-cli.js --bogus >/dev/null 2>&1
          usage_rc=$?
          set -e
          [ "$usage_rc" -eq 2 ] || {
            echo "FATAL: unknown arguments must exit 2 (usage), got $usage_rc"
            exit 1
          }
          echo "migrate CLI OK (--help exits 0, fresh DB migrates fully, unknown args exit 2)"

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build backend
        run: npm run build

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          DNS_TERTIARY_ENABLED: "false"
          DNS_CONSENSUS_ENABLED: "false"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
