name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        # Node 20 is only exercised on Linux: better-sqlite3 v12.x ships no
        # win32 prebuild for Node 20 (ABI 115) and the node-gyp fallback
        # cannot compile against the VS 18 toolchain on windows-latest.
        # Node 22 and 24 both have win32-x64 prebuilds.
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: windows-latest, node: 22 }
          - { os: windows-latest, node: 24 }
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 has no win32 prebuild for every Node ABI; when a
      # prebuild is missing node-gyp falls back to compiling from source,
      # which needs a working MSVC environment (the runner's VS detection
      # is unreliable on windows-latest).
      - name: Set up MSVC build tools (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Migration sync check
        run: npm run db:sync:check

      - name: Native bindings load check
        shell: bash
        run: |
          set -euo pipefail
          node -e "const db = require('better-sqlite3')(':memory:'); db.exec('CREATE TABLE t (a)'); console.log('better-sqlite3 OK')"
          node -e "const sharp = require('sharp'); console.log('sharp OK', sharp.versions.sharp)"

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  docker-smoke:
    name: Docker runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: dominus-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build-only validation of the remaining runtime targets so a broken
      # Dockerfile stage (worker/scheduler) fails the PR, not the deploy.
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          load: false
          tags: dominus-worker:test
          cache-from: type=gha

      - name: Build scheduler image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: scheduler
          load: false
          tags: dominus-scheduler:test
          cache-from: type=gha

      - name: Smoke test — native binding + health endpoint
        env:
          SMOKE_CONTAINER: dominus-smoke
        run: |
          set -euo pipefail

          # 1. The better-sqlite3 native binding must load inside the image.
          docker run --rm --entrypoint node dominus-api:test \
            -e "const db = require('better-sqlite3')(':memory:'); db.exec('CREATE TABLE t (a)'); console.log('better-sqlite3 OK')"

          # 2. The API must boot and answer /api/health (unauthenticated).
          #    DATABASE_PATH points at /tmp so no volume is needed and the
          #    non-root user can write. HOST must be 0.0.0.0 for the
          #    published port to forward, which requires API_KEYS or the
          #    app aborts with a security fatal at startup.
          docker run -d --name "$SMOKE_CONTAINER" -p 3000:3000 \
            -e DATABASE_PATH=/tmp/dominus.db \
            -e HOST=0.0.0.0 \
            -e API_KEYS=smoke-test-key dominus-api:test

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "healthcheck OK (attempt $i)"
              docker rm -f "$SMOKE_CONTAINER" >/dev/null
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx "$SMOKE_CONTAINER"; then
              echo "container exited — dumping logs" >&2
              docker logs "$SMOKE_CONTAINER" >&2 || true
              docker rm -f "$SMOKE_CONTAINER" >/dev/null
              exit 1
            fi
            sleep 2
          done

          echo "healthcheck never succeeded" >&2
          docker logs "$SMOKE_CONTAINER" >&2 || true
          docker rm -f "$SMOKE_CONTAINER" >/dev/null
          exit 1

  compose-config:
    name: Compose topology & monitoring config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-test-password
      # DOMINUS_IMAGE_TAG is required (ADR-0046): a stable release tag is
      # enough for topology validation; the pinned-digest existence check
      # below validates the immutable refs against the registry.
      DOMINUS_IMAGE_TAG: v0.10.1

    steps:
      - uses: actions/checkout@v4

      # The base compose file must start the full app by default
      # (api + worker + scheduler) and must NOT define the Cloud data
      # stores — postgres/redis live in the production overlay so the
      # community edition never pulls them.
      - name: Validate base compose config
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          services=$(docker compose -f docker-compose.yml config --services)
          for expected in api worker scheduler; do
            grep -qx "$expected" <<<"$services" || {
              echo "FATAL: base compose is missing service '$expected'"; exit 1
            }
          done
          if echo "$services" | grep -qx postgres || echo "$services" | grep -qx redis; then
            echo "FATAL: postgres/redis must not be in the base compose file"
            exit 1
          fi

      # The merged production profile must start the full Cloud stack — this
      # guards the regression where the documented prod command silently ran
      # api-only because worker/scheduler/postgres/redis were profile-gated.
      - name: Validate merged production compose config
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          services=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --services)
          for expected in api worker scheduler postgres redis redis-exporter prometheus alertmanager grafana; do
            echo "$services" | grep -qx "$expected" || {
              echo "FATAL: prod compose is missing service '$expected'"; exit 1
            }
          done

      # The optional DNS-consensus override (ADR-0042) must merge cleanly on
      # top of the prod profile and pin the recursor to its fixed address.
      - name: Validate DNS-consensus override compose config
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.dns-consensus.yml config --quiet
          services=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.dns-consensus.yml config --services)
          for expected in api worker scheduler postgres redis consensus-dns; do
            echo "$services" | grep -qx "$expected" || {
              echo "FATAL: dns-consensus override is missing service '$expected'"; exit 1
            }
          done
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.dns-consensus.yml config --format json \
            | grep -q '"172.20.0.10"' || {
              echo "FATAL: consensus-dns must be pinned to 172.20.0.10"; exit 1
            }

      - name: Validate Prometheus config and rules
        run: |
          set -euo pipefail
          # prom/prometheus ENTRYPOINT is the prometheus binary, so promtool
          # must be set via --entrypoint, not appended as a command.
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.53.1@sha256:f20d3127bf2876f4a1df76246fca576b41ddf1125ed1c546fbd8b16ea55117e6 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.53.1@sha256:f20d3127bf2876f4a1df76246fca576b41ddf1125ed1c546fbd8b16ea55117e6 check rules /etc/prometheus/rules.yml

      - name: Validate Alertmanager config
        run: |
          set -euo pipefail
          # Same entrypoint caveat as promtool: override to run amtool directly.
          docker run --rm --entrypoint amtool -v "$PWD/deploy/prometheus:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5 check-config /etc/alertmanager/alertmanager.yml

      # ADR-0046: a digest-pinned reference to a nonexistent image is still a
      # broken rollout (the original nlnetlabs/unbound recursor reference was
      # exactly that). Verify every pinned external image actually exists in
      # its registry before the PR can merge.
      - name: Verify pinned image digests exist in registry
        run: |
          set -euo pipefail
          refs=$(grep -hoE 'image: [^ ]+@sha256:[0-9a-f]{64}' \
            docker-compose.prod.yml docker-compose.dns-consensus.yml | awk '{print $2}' | sort -u)
          for ref in $refs; do
            docker buildx imagetools inspect "$ref" >/dev/null 2>&1 || {
              echo "FATAL: pinned image not found in registry: $ref"; exit 1
            }
            echo "OK: $ref"
          done

  image-pins:
    name: Immutable image pins (ADR-0046)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check every image reference is pinned
        run: npm run check:image-pins

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build
