name: Deploy

on:
  push:
    branches: [master]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}-worker
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Scheduler image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: scheduler
          push: true
          tags: ${{ steps.meta.outputs.tags }}-scheduler
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner app node
    runs-on: ubuntu-latest
    needs: docker
    # Tags only. The SSH host secret decides whether the deploy actually
    # runs (secrets cannot be referenced in job-level if; surfaced via
    # env, gated per step).
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        if: env.DEPLOY_SSH_HOST != ''
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # The rendered compose references ${DOMINUS_IMAGE_TAG} from .env at
      # runtime, so a release bump is a single .env edit + pull + roll and
      # stays out of Terraform's plan/apply cycle (an apply would recreate
      # the node and lose the named volumes).
      - name: Bump tag, pull and roll the stack
        if: env.DEPLOY_SSH_HOST != ''
        env:
          HOST: ${{ env.DEPLOY_SSH_HOST }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new "root@${HOST}" bash -s <<EOF
          set -euo pipefail
          cd /opt/dominus
          sed -i "s|^DOMINUS_IMAGE_TAG=.*|DOMINUS_IMAGE_TAG=${TAG}|" .env
          docker compose pull api worker scheduler
          docker compose up -d
          # Regression guard: the rendered compose used to pin a literal
          # tag, so a bump re-pulled and re-rolled the OLD image while the
          # health poll below reported green. Fail loudly unless every
          # service actually runs the release tag.
          for svc in api worker scheduler; do
            expected="ghcr.io/alessiobrillo/dominus:${TAG}"
            [ "\$svc" != "api" ] && expected="\${expected}-\${svc}"
            actual=\$(docker inspect --format '{{.Image}}' "dominus-\${svc}-1")
            if [ "\$actual" != "\$expected" ]; then
              echo "expected \${svc} to run \${expected}, running \${actual}" >&2
              exit 1
            fi
          done
          for i in \$(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then
              echo "api healthy on ${TAG} after roll"
              exit 0
            fi
            sleep 5
          done
          echo "api did not become healthy within 150s" >&2
          exit 1
          EOF

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Publish release from CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${tag#v}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "No CHANGELOG section for ${version} — creating release with auto-generated notes"
            gh release create "$tag" --generate-notes
            exit 0
          fi
          # Extract the version's section: from its header to the next top-level
          # header (## [x.y.z] or ## x.y.z), then write the release notes.
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" || $0 ~ "^## " v " " { insec=1; next }
            insec && /^## / { exit }
            insec { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md || { echo "Empty section for ${version}"; exit 1; }
          gh release create "$tag" --notes-file /tmp/release-notes.md
