name: Deploy

on:
  push:
    branches: [master]
    tags: ['v*']
  # Manual rollout to staging. A release is rehearsed on staging and
  # promoted to production by tagging — never the other way round.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging deploys the tag you pass below)'
        type: choice
        options:
          - staging
          - none
        default: staging
      tag:
        description: 'Image tag to deploy (vX.Y.Z or sha-<commit>)'
        type: string
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One metadata step per image. The worker/scheduler suffix goes through
      # `flavor`, which applies it to EVERY generated tag; appending "-worker"
      # to the multi-line `tags` output only suffixed the last line, so the
      # worker and scheduler pushes overwrote the API's version tags.
      # Version tags carry the `v` prefix because the rollout, compose and
      # Terraform all pin `vX.Y.Z` (DOMINUS_IMAGE_TAG = the git tag).
      - name: Extract API image metadata
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Extract Worker image metadata
        id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-worker,onlatest=true
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Extract Scheduler image metadata
        id: meta-scheduler
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-scheduler,onlatest=true
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Scheduler image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: scheduler
          push: true
          tags: ${{ steps.meta-scheduler.outputs.tags }}
          labels: ${{ steps.meta-scheduler.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Two targets, two sets of secrets, two decisions.
  #
  # Before this split the workflow had ONE host and ONE secret pair, and
  # every `v*` tag deployed to it: pushing a tag was a production event
  # by accident, with no environment, no approval and no way to rehearse
  # a release anywhere but on the node the customers use. The two targets
  # are now explicit:
  #
  #   production — a release tag, and only a release tag. The environment
  #     carries the deploy secrets and requires an approval, so the tag
  #     alone is not enough to change what the customers are served.
  #   staging   — an explicit dispatch, never a tag. This is where the
  #     acceptance evidence and the restore drill are produced.
  #
  # They are two jobs and not one job with a matrix: the environment name
  # is resolved before the matrix is expanded, so `environment:
  # ${{ matrix.environment }}` is not a valid expression and the workflow
  # fails to parse — at run time, on the push to master, where nobody
  # looks. The rollout itself is a shared composite action, so the two
  # targets cannot drift.
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Resolve the tag to deploy
        run: |
          set -euo pipefail
          echo "deploying ${GITHUB_REF_NAME} to production"

      - uses: ./.github/actions/deploy-target
        if: env.DEPLOY_SSH_HOST != ''
        with:
          host: ${{ env.DEPLOY_SSH_HOST }}
          ssh_key: ${{ env.DEPLOY_SSH_KEY }}
          tag: ${{ github.ref_name }}

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    environment: staging
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      # Fail loudly instead of rolling an empty tag. A staging dispatch
      # without a tag is a mistake, not a request to deploy "whatever".
      - name: Resolve the tag to deploy
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error title=Missing tag::No image tag to deploy. Pass one explicitly (e.g. v1.3.1 or sha-<commit>)."
            exit 1
          fi
          echo "deploying ${TAG} to staging"

      - uses: ./.github/actions/deploy-target
        if: env.DEPLOY_SSH_HOST != ''
        with:
          host: ${{ env.DEPLOY_SSH_HOST }}
          ssh_key: ${{ env.DEPLOY_SSH_KEY }}
          tag: ${{ inputs.tag }}