name: Deploy

on:
  push:
    branches: [master]
    tags: ['v*']
  # Manual rollout to staging. A release is rehearsed on staging and
  # promoted to production by tagging — never the other way round.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging deploys the tag you pass below)'
        type: choice
        options:
          - staging
          - none
        default: staging
      tag:
        description: 'Image tag to deploy (vX.Y.Z or sha-<commit>)'
        type: string
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One metadata step per image. The worker/scheduler suffix goes through
      # `flavor`, which applies it to EVERY generated tag; appending "-worker"
      # to the multi-line `tags` output only suffixed the last line, so the
      # worker and scheduler pushes overwrote the API's version tags.
      # Version tags carry the `v` prefix because the rollout, compose and
      # Terraform all pin `vX.Y.Z` (DOMINUS_IMAGE_TAG = the git tag).
      - name: Extract API image metadata
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Extract Worker image metadata
        id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-worker,onlatest=true
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Extract Scheduler image metadata
        id: meta-scheduler
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-scheduler,onlatest=true
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Scheduler image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: scheduler
          push: true
          tags: ${{ steps.meta-scheduler.outputs.tags }}
          labels: ${{ steps.meta-scheduler.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 20
    # Two targets, two sets of secrets, two decisions.
    #
    # Before this split the workflow had ONE host and ONE secret pair, and
    # every `v*` tag deployed to it: pushing a tag was a production event
    # by accident, with no environment, no approval and no way to rehearse
    # a release anywhere but on the node the customers use. The two targets
    # are now explicit:
    #
    #   production — a release tag, and only a release tag. The
    #     environment carries the deploy secrets, so a repository-level
    #     secret can no longer reach production by accident.
    #   staging   — an explicit dispatch, never a tag. This is where the
    #     acceptance evidence and the restore drill are produced.
    #
    # A job-level `if` is evaluated per matrix instance, so exactly one of
    # the two runs for any given event.
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            trigger: tag
          - environment: staging
            trigger: manual
    if: >-
      (matrix.trigger == 'tag' && startsWith(github.ref, 'refs/tags/v')) ||
      (matrix.trigger == 'manual' && github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: ${{ matrix.environment }}
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      # The tag to roll: the release tag for production, the operator's
      # choice for staging (vX.Y.Z or sha-<commit>).
      DEPLOY_TAG: ${{ matrix.trigger == 'tag' && github.ref_name || inputs.tag }}

    steps:
      # Fail loudly instead of rolling an empty tag. A staging dispatch
      # without a tag is a mistake, not a request to deploy "whatever".
      - name: Resolve the tag to deploy
        if: env.DEPLOY_SSH_HOST != ''
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TAG}" ]; then
            echo "::error title=Missing tag::No image tag to deploy. Pass one explicitly (e.g. v1.3.1 or sha-<commit>)."
            exit 1
          fi
          echo "deploying ${DEPLOY_TAG} to ${{ matrix.environment }}"

      - uses: webfactory/ssh-agent@v0.10.0
        if: env.DEPLOY_SSH_HOST != ''
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Migrate-before-roll (ADR-0061): the target image's schema
      # migrations run explicitly BEFORE the rollout, with their own
      # timeout budget, so slow DDL can never trip the health poll of the
      # roll phase. The migrate step always runs the TARGET image
      # (DOMINUS_IMAGE_TAG forced from the shell, which takes precedence
      # over .env for interpolation) against the live database. On failure
      # or timeout no image is rolled and the operator restores from a
      # PITR backup instead of rolling back blindly.
      - name: Run schema migrations (migrate-before-roll)
        if: env.DEPLOY_SSH_HOST != ''
        env:
          HOST: ${{ env.DEPLOY_SSH_HOST }}
          TAG: ${{ env.DEPLOY_TAG }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=accept-new \
            scripts/deploy/migrate.sh "root@${HOST}:/tmp/dominus-migrate.sh"
          ssh -o StrictHostKeyChecking=accept-new "root@${HOST}" \
            "cd /opt/dominus && DOMINUS_TAG=${TAG} bash /tmp/dominus-migrate.sh"

      # Bump tag, pull and roll the stack (auto-rollback). The rollout
      # re-checks the gate (its rollback path needs the decision) and
      # restores the previous tag automatically when the health poll never
      # goes green.
      - name: Bump tag, pull and roll the stack (auto-rollback)
        if: env.DEPLOY_SSH_HOST != ''
        env:
          HOST: ${{ env.DEPLOY_SSH_HOST }}
          TAG: ${{ env.DEPLOY_TAG }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=accept-new \
            scripts/deploy/rollout.sh "root@${HOST}:/tmp/dominus-rollout.sh"
          ssh -o StrictHostKeyChecking=accept-new "root@${HOST}" \
            "cd /opt/dominus && DOMINUS_TAG=${TAG} bash /tmp/dominus-rollout.sh"
