name: IaC

on:
  pull_request:
    paths:
      - 'deploy/terraform/**'
  push:
    branches: [master]
    paths:
      - 'deploy/terraform/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      # tfvars are gitignored and CI has no Hetzner token: fmt + validate
      # are credential-free and catch syntax/schema drift on every PR.
      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      # The rendered cloud-init is the actual deliverable; substitute every
      # template placeholder with dummy values and parse the result as YAML,
      # so a typo (bad interpolation, broken indentation) fails the PR
      # before it reaches a node. Conditionals and loops are evaluated
      # (not just stripped) so both branches stay renderable and the
      # b2-disabled path is regression-checked.
      - name: Smoke-render cloud-init templates
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          import yaml

          fixtures = {
              'project': 'dominus', 'image_tag': 'v1.0.0', 'domain': 'test.example',
              'db_host': '10.0.0.3', 'db_password': 'dummy', 'db_backup_password': 'dummy_backup',
              'db_app_password': 'dummy_app',
              'b2_enabled': True,
              'b2_bucket': 'b', 'b2_account_id': 'a', 'b2_app_key': 'k',
              'b2_endpoint': 'https://s3.example',
              'app_env': {'K': 'V'},
              'unbound_conf': 'do-not-query-localhost: yes\nhide-identity: yes\n',
              'prometheus_yml': 'global:\n  scrape_interval: 30s\n',
              'rules_yml': 'groups: []\n',
              'alertmanager_yml': 'route:\n  receiver: test\n',
              'metrics_token': 'dummy-token',
              'metrics_token_set': False,
          }

          def render(text, ctx):
              # %{ if X } ... %{ else } ... %{ endif } — evaluate, keep branch.
              def if_repl(m):
                  body = render(m.group(2), ctx)
                  if not ctx.get(m.group(1)):
                      body = render(m.group(3) or '', ctx)
                  return body
              text = re.sub(
                  r'%\{ *if +(\w+) *\~?\}(.*?)(?:%\{ *else *\~?\}(.*?))?%\{ *endif *\~?\}',
                  if_repl, text, flags=re.S)
              # %{ for k, v in MAP } ... %{ endfor }
              def for_repl(m):
                  k, v, coll, body = m.group(1), m.group(2), m.group(3), m.group(4)
                  return ''.join(
                      render(body, {**ctx, k: kk, v: vv})
                      for kk, vv in (ctx.get(coll) or {}).items())
              text = re.sub(r'%\{ *for +(\w+), *(\w+) +in +(\w+) *\~?\}(.*?)%\{ *endfor *\~?\}',
                            for_repl, text, flags=re.S)
              return text

          def subst(m):
              key = m.group(1)
              # Loop variables (body of %{ for k, v in app_env }).
              if key == 'k':
                  return 'K'
              if key == 'v':
                  return 'V'
              # ${indent(6, name)} — re-indent the fixture to mimic terraform.
              im = re.fullmatch(r'indent\((\d+), (\w+)\)', key)
              if im:
                  n, name = int(im.group(1)), im.group(2)
                  if name not in fixtures:
                      raise SystemExit(f'unknown template variable: {name}')
                  return '\n'.join(
                      ' ' * n + line if line else '' for line in str(fixtures[name]).split('\n'))
              if key in fixtures:
                  return str(fixtures[key])
              raise SystemExit(f'unknown template variable: {key}')

          def render_file(tpl, overrides=None):
              ctx = {**fixtures, **(overrides or {})}
              text = render(tpl.read_text(), ctx)
              # Negative lookbehind: $${VAR} is Terraform's escape for a
              # literal ${VAR} (runtime docker-compose interpolation) — it
              # must pass through untouched, not be substituted.
              text = re.sub(r'(?<!\$)\$\{([^}]+)\}', subst, text)
              docs = list(yaml.safe_load_all(text))
              if not docs or not isinstance(docs[0], dict) or not docs[0]:
                  raise AssertionError('not a valid YAML mapping')
              return text

          ok = True
          for tpl in pathlib.Path('.').glob('modules/*/files/*.tftpl'):
              try:
                  render_file(tpl)
                  print(f'OK   {tpl}')
              except (AssertionError, yaml.YAMLError) as e:
                  print(f'FAIL {tpl}: {e}')
                  ok = False

          # Regression: with B2 disabled no PITR cron or rclone config may
          # be rendered (empty credentials previously broke the daily cron).
          # Precise needles: 'dominus-pitr' alone also matches the
          # conf.d/dominus-pitr.conf path and 'rclone.conf' matches a
          # comment, so match the exact file paths.
          db_tpl = pathlib.Path('modules/db-node/files/cloud-init.yaml.tftpl')
          for enabled, should_have in ((False, False), (True, True)):
              text = render_file(db_tpl, {'b2_enabled': enabled})
              has_cron = 'cron.d/dominus-pitr' in text
              has_rclone = 'rclone/rclone.conf' in text
              good = has_cron == should_have and has_rclone == should_have
              print(f"{'OK  ' if good else 'FAIL'} b2_enabled={enabled} "
                    f"(cron={has_cron}, rclone={has_rclone})")
              ok = ok and good

          # Regression (deploy pipeline): the rendered compose must reference
          # the image tag through the runtime $${DOMINUS_IMAGE_TAG} .env
          # variable. A literal tag here means a release bump re-pulls and
          # re-rolls the OLD image while the deploy health poll reports green.
          app_tpl = pathlib.Path('modules/app-node/files/cloud-init.yaml.tftpl')
          app_text = render_file(app_tpl)
          if '$${DOMINUS_IMAGE_TAG}' not in app_text:
              print('FAIL app compose does not interpolate DOMINUS_IMAGE_TAG at runtime')
              ok = False
          if 'ghcr.io/alessiobrillo/dominus:v1.0.0' in app_text:
              print('FAIL app compose pins a literal image tag (deploy bumps would be a no-op)')
              ok = False

          # METRICS_TOKEN trap (silent alerting death): with the token set the
          # app node must render the metrics-token file and mount it; with it
          # unset neither may be present.
          for token_set, expect_file in ((False, False), (True, True)):
              text = render_file(app_tpl, {'metrics_token_set': token_set})
              has_token_file = 'prometheus/metrics-token' in text
              good = has_token_file == expect_file
              print(f"{'OK  ' if good else 'FAIL'} metrics_token_set={token_set} "
                    f"(token file={has_token_file})")
              ok = ok and good

          # The module's prometheus.yml transformation (main.tf): with
          # METRICS_TOKEN set the bearer block must be active — a configured
          # token with a commented block would 401 every scrape and kill
          # alerting silently. Replicates the HCL replace chain so drift in
          # the marker lines fails CI.
          prom_yml = pathlib.Path('../prometheus/prometheus.yml').read_text()
          activated = prom_yml
          for needle, replacement in (
              ('    # METRICS_TOKEN_RENDER:START\n', ''),
              ('    # METRICS_TOKEN_RENDER:END\n', ''),
              ('# authorization:', 'authorization:'),
              ('#   type: Bearer', '  type: Bearer'),
              ('#   credentials_file: /etc/prometheus/metrics-token',
               '  credentials_file: /etc/prometheus/metrics-token'),
          ):
              activated = activated.replace(needle, replacement)
          scrape = yaml.safe_load(activated)['scrape_configs'][0]
          if scrape.get('authorization', {}).get('type') != 'Bearer':
              print('FAIL METRICS_TOKEN auth block not activated by module transform')
              ok = False
          else:
              print('OK   prometheus METRICS_TOKEN block activates on render')
          if 'METRICS_TOKEN_RENDER:START' not in prom_yml:
              print('FAIL prometheus.yml lost its render markers')
              ok = False

          # Alertmanager webhook trap (silent alerting death): the shipped
          # alertmanager.yml uses an example.com placeholder; the module's
          # alertmanager_webhook_url variable substitutes the operator's real
          # URL. A node that keeps the placeholder alerts nowhere. Replicates
          # the HCL replace (modules/app-node/main.tf) so drift in either the
          # placeholder or the replace chain fails CI, and verifies the
          # rendered file parses and routes to the substituted URL.
          am_yml = pathlib.Path('../prometheus/alertmanager.yml').read_text()
          am_placeholder = 'https://example.com/your-webhook'
          if am_placeholder not in am_yml:
              print('FAIL alertmanager.yml lost its example.com placeholder needle')
              ok = False
          test_webhook = 'https://hooks.example/dominus-alerts'
          am_sub = am_yml.replace(am_placeholder, test_webhook)
          am_routes = yaml.safe_load(am_sub)
          webhook_url = (
              am_routes.get('receivers', [{}])[0]
              .get('webhook_configs', [{}])[0].get('url'))
          if webhook_url != test_webhook:
              print('FAIL alertmanager webhook URL not substituted by module transform')
              ok = False
          else:
              print('OK   alertmanager webhook URL substitutes on render')

          # The rendered app compose must mount the backups volume on the
          # worker and scheduler: the scheduler enqueues the BACKUP job but
          # the worker executes pg_dump, and BACKUP_DIR=/backups is only
          # durable if /backups is a named volume (lost on recreate
          # otherwise — silent backup death).
          for svc in ('worker', 'scheduler'):
              if f'{svc}:\n' not in app_text:
                  print(f'FAIL app compose missing {svc} service')
                  ok = False
          if app_text.count('backups:/backups') < 2:
              print('FAIL app compose does not mount backups volume on worker+scheduler')
              ok = False
          else:
              print('OK   app compose mounts backups volume on worker+scheduler')
          if 'BACKUP_DIR=/backups' not in app_text:
              print('FAIL app compose .env missing BACKUP_DIR=/backups')
              ok = False
          else:
              print('OK   app compose .env sets BACKUP_DIR=/backups')

          # Network hardening regression (GA sprint): the rendered nodes
          # must carry the TLS + fail2ban + keys-only-SSH posture. A drift
          # (e.g. a re-edit dropping the hostssl rows or the sslmode) fails
          # the PR before it reaches a node.
          app_hard = render_file(app_tpl)
          if 'sslmode=require' not in app_hard:
              print('FAIL app .env missing sslmode=require on DATABASE_URL')
              ok = False
          else:
              print('OK   app .env enforces sslmode=require')
          if 'fail2ban' not in app_hard or 'sshd_config.d/99-dominus.conf' not in app_hard:
              print('FAIL app node missing fail2ban or keys-only sshd drop-in')
              ok = False
          else:
              print('OK   app node has fail2ban + keys-only sshd')
          db_hard = render_file(db_tpl)
          if 'hostssl all dominus 10.0.0.0/16' not in db_hard:
              print('FAIL db node pg_hba missing hostssl rows')
              ok = False
          else:
              print('OK   db node pg_hba enforces hostssl-only')
          if 'host all dominus 10.0.0.0/16' in db_hard:
              print('FAIL db node pg_hba still allows plaintext host rows')
              ok = False
          for needle in ('ssl = on', 'dominus-ssl.conf', 'openssl req -x509'):
              if needle not in db_hard:
                  print(f'FAIL db node missing {needle}')
                  ok = False
          if 'hostssl all dominus 10.0.0.0/16' in db_hard and \
                  'host all dominus 10.0.0.0/16' not in db_hard and \
                  'ssl = on' in db_hard and 'dominus-ssl.conf' in db_hard and \
                  'openssl req -x509' in db_hard:
              print('OK   db node TLS posture complete')

          sys.exit(0 if ok else 1)
          PY

  plan:
    name: Terraform plan (Hetzner creds present)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs only when the repo has the Hetzner token configured; otherwise
    # fmt + validate + smoke-render above are the gate. (secrets cannot be
    # referenced in job-level if; surfaced via env, gated per step.)
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    defaults:
      run:
        working-directory: deploy/terraform

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Plan
        if: env.HCLOUD_TOKEN != ''
        env:
          TF_VAR_hcloud_token: ${{ env.HCLOUD_TOKEN }}
        run: |
          cat > terraform.tfvars <<'EOF'
          hcloud_token      = "unused"
          ssh_public_key    = "ssh-ed25519 dummy"
          domain            = "app.example.com"
          image_tag         = "v1.0.0"
          db_password       = "dummy"
          db_backup_password = "dummy"
          db_app_password   = "dummy"
          alertmanager_webhook_url = ""
          hetzner_dns_token = ""
          b2_backup = {
            enabled         = true
            bucket          = "dummy"
            account_id      = "dummy"
            application_key = "dummy"
            endpoint        = "https://s3.example"
          }
          EOF
          terraform plan -input=false -no-color