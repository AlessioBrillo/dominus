name: Release

# Publishes the community-edition artifacts on a version tag:
#   - GitHub Release with notes extracted from the CHANGELOG section
#   - npm package `dominus-oss`, built from the same commit
#   - a verification of the PUBLISHED artifact (install, boot, version)
#
# Deliberately separate from deploy.yml: the Cloud rollout (Terraform, SSH,
# migrate-before-roll) and the public artifact publication have different
# triggers, different blast radius and different failure modes. Keeping them
# in one workflow meant the release step silently degraded when the CHANGELOG
# section was missing — `--generate-notes` produced a release with no notes
# at all, which is how an empty public release notes page happens.
#
# npm is published with OIDC trusted publishing: the workflow requests a
# short-lived token bound to this repository, environment and commit (OIDC
# token → npm). No long-lived NPM_TOKEN secret exists to leak, and the token
# is bound to the exact version being published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify the release but do not publish'
        type: boolean
        default: false
      version:
        description:
          'Version to rehearse (a dry run from a branch). Defaults to the version in package.json.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  # ADR-0098 says the live canary "fails the release workflow if the endpoint
  # drifts". Until v1.3.4 the canary existed and no workflow ran it, so the
  # claim was false and the one non-negotiable gate (Principle 6) could drift
  # silently between releases. This job makes the claim true: a tag does not
  # publish if the gate cannot answer.
  trademark-canary:
    name: Trademark gate canary (live registers)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Assert the gate answers (registered -> blocked, free -> clear)
        run: npm run check:trademarks

  release:
    name: Publish GitHub Release and npm package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: trademark-canary
    permissions:
      contents: write # release notes + release asset
      # Required for OIDC trusted publishing: `npm publish` requests a
      # short-lived token from GitHub's OIDC provider. Without this the
      # publish step fails with a token exchange error that reads like an
      # npm-side problem, which is the wrong place to look.
      id-token: write
    outputs:
      # The verified job needs the version it must install: a step output
      # is not visible across jobs.
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}

    steps:
      - uses: actions/checkout@v7
        with:
          # full history: the CHANGELOG extraction compares against the
          # previous tag, and standard-version conventions reference commits.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # ------------------------------------------------------------------
      # Version resolution
      # ------------------------------------------------------------------
      # The version comes from the tag on a tag push, and from the
      # `version` input (or package.json) on a manual dispatch.
      #
      # The previous implementation derived the version from `GITHUB_REF`
      # with `${GITHUB_REF#refs/tags/}`. On a branch that expansion does
      # not match, so the version became the literal string
      # `refs/heads/master` and the CHANGELOG lookup below could never
      # succeed: the dry run that `docs/releases/npm-publishing.md` tells
      # the operator to run before the first publish was guaranteed to
      # fail. The version is now resolved explicitly, and a tag that
      # disagrees with package.json is refused before anything is built.
      - name: Resolve the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
            tag="${REF_NAME}"
          else
            version="${INPUT_VERSION:-${pkg_version}}"
            version="${version#v}"
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "package_version=${pkg_version}" >> "$GITHUB_OUTPUT"
          echo "resolved version ${version} (package.json: ${pkg_version}, ref: ${REF_TYPE} ${REF_NAME})"

      - name: Verify the tag matches the package version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error title=Version mismatch::The tag is v${VERSION} but package.json says ${PACKAGE_VERSION}."
          echo "The published artifact and the repository would disagree. Bump the version, merge it, and tag the merge commit."
            exit 1
          fi
          echo "tag v${VERSION} matches package.json"

      # The SPA has to be built before the backend: `dist/web/` must exist in
      # the tarball or every HTML route in the published package 404s. CI
      # catches this via check-pack, which is why this step runs even in a
      # dry run — an artifact that only works because a Docker build
      # synthesised the frontend is not the artifact a consumer receives.
      - name: Build frontend
        run: npm --prefix frontend ci && npm run build:frontend

      - name: Build backend and validate the tarball
        run: |
          npm ci
          npm run build
          # check-pack fails loudly on a missing frontend or data file,
          # instead of shipping a package whose SPA route is a 404.
          npm run check:pack

      # The tarball is built ONCE and used for every channel: the asset
      # attached to the GitHub Release and the package published to npm are
      # the same bytes. Building it twice (once for the asset, once inside
      # `npm publish`) would produce two artifacts that look identical and
      # are not, and the "published artifact is verified" rule (ADR-0091)
      # would be a claim about a file nobody checked.
      - name: Build the distributable tarball
        id: tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-artifacts
          npm pack --pack-destination /tmp/release-artifacts
          tarball="/tmp/release-artifacts/dominus-oss-${VERSION}.tgz"
          if [ ! -f "${tarball}" ]; then
            echo "::error title=Missing tarball::npm pack did not produce ${tarball}."
            exit 1
          fi
          # The checksum travels with the artifact: a user who downloads the
          # tarball can verify it without trusting the release page.
          ( cd /tmp/release-artifacts && sha256sum "dominus-oss-${VERSION}.tgz" > "dominus-oss-${VERSION}.tgz.sha256" )
          # The alias is the stable, versionless URL an installer and a
          # reader rely on: `dominus-oss.tgz` always resolves to the latest
          # release. It is a copy of the same bytes, never a different build.
          cp "${tarball}" "/tmp/release-artifacts/dominus-oss.tgz"
          cp "/tmp/release-artifacts/dominus-oss-${VERSION}.tgz.sha256" "/tmp/release-artifacts/dominus-oss.tgz.sha256"
          echo "path=${tarball}" >> "$GITHUB_OUTPUT"
          echo "alias=/tmp/release-artifacts/dominus-oss.tgz" >> "$GITHUB_OUTPUT"
          echo "alias_checksum=/tmp/release-artifacts/dominus-oss.tgz.sha256" >> "$GITHUB_OUTPUT"
          echo "checksum=/tmp/release-artifacts/dominus-oss-${VERSION}.tgz.sha256" >> "$GITHUB_OUTPUT"

      # The installers are the one-command on-ramps for Linux/macOS and
      # Windows. They download the alias tarball, verify its checksum, and
      # install with npm into a user-owned prefix (no sudo / admin required).
      # They ship beside the release, not inside the npm tarball.
      - name: Make the installers executable
        id: installers
        run: |
          set -euo pipefail
          chmod +x scripts/install.sh
          echo "shell=${{ github.workspace }}/scripts/install.sh" >> "$GITHUB_OUTPUT"
          echo "powershell=${{ github.workspace }}/scripts/install.ps1" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------------
      # The previous behaviour degraded silently: a missing CHANGELOG
      # section produced a release with auto-generated notes, and no one
      # noticed until the release page was read. Now a missing or empty
      # section fails the workflow, so a tag cannot be half-published.
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error title=Missing CHANGELOG section::CHANGELOG.md has no section for ${version}.
          Add '## [${version}]' before tagging. Refusing to publish a release with no notes."
            exit 1
          fi
          # From the version's header to the next top-level header, so the
          # section body is isolated rather than the whole document.
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" || $0 ~ "^## " v " " { insec=1; next }
            insec && /^## / { exit }
            insec { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md || { echo "::error title=Empty CHANGELOG section::Section for ${version} is empty."; exit 1; }

      - name: Publish GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          # Idempotent on re-run. The npm step below this one can fail after the
          # release already exists (for example when the trusted publisher has
          # not been configured yet), and re-running the workflow must not then
          # fail on a release that is already there. Create on first pass,
          # update the notes if it exists.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — updating its notes."
            gh release edit "${tag}" --notes-file /tmp/release-notes.md
          else
            gh release create "${tag}" --notes-file /tmp/release-notes.md
          fi

      # The tarball is a distribution channel in its own right. The npm
      # trusted publisher has failed twice (E404: the publisher is not
      # configured on the npm account), and until it is, the registry is the
      # ONLY channel the community edition has - and a release that depends
      # on an account setting nobody can automate is one click away from
      # being no channel at all. The asset is the tarball the release
      # workflow built and verified, with its checksum beside it.
      - name: Attach the tarball, its alias, checksums and installers to the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARBALL: ${{ steps.tarball.outputs.path }}
          CHECKSUM: ${{ steps.tarball.outputs.checksum }}
          ALIAS: ${{ steps.tarball.outputs.alias }}
          ALIAS_CHECKSUM: ${{ steps.tarball.outputs.alias_checksum }}
          INSTALLER_SHELL: ${{ steps.installers.outputs.shell }}
          INSTALLER_POWERSHELL: ${{ steps.installers.outputs.powershell }}
        run: |
          set -euo pipefail
          # The versioned tarball and checksum are the immutable record.
          gh release upload "${TAG}" "${TARBALL}" "${CHECKSUM}" --clobber
          # The alias is the stable channel an installer and a reader rely
          # on: `dominus-oss.tgz` always resolves to the latest release.
          gh release upload "${TAG}" "${ALIAS}" "${ALIAS_CHECKSUM}" --clobber
          # One-command installers for Linux/macOS and Windows.
          gh release upload "${TAG}" "${INSTALLER_SHELL}" "${INSTALLER_POWERSHELL}" --clobber

      # ------------------------------------------------------------------
      # npm package
      # ------------------------------------------------------------------
      # OIDC trusted publishing: `npm publish` detects the OIDC environment
      # and exchanges it for a token, so nothing is stored in secrets.
      # `--provenance` publishes the build's cryptographic provenance,
      # letting anyone verify the tarball was built from this repository,
      # this commit, by this workflow.
      - name: Publish to npm (dry run)
        if: env.DRY_RUN == 'true'
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: npm publish "${TARBALL}" --dry-run --provenance

      # The publish is idempotent. npm refuses to overwrite a version that
      # is already on the registry (E403), and the only way to claim the
      # package name before the trusted publisher can be configured is a
      # manual publish — so a re-run of this workflow for a version that is
      # already published used to fail here, and because `verify` depends
      # on this job, the verification of the PUBLISHED artifact was skipped
      # with it. The artifact stayed unverified for the exact reason it was
      # supposed to be checked. Detect the existing version and skip.
      - name: Check whether the version is already published
        id: npm-version-state
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_NAME: dominus-oss
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${VERSION} is already on the registry — skipping the publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${VERSION} is not published yet."
          fi

      - name: Publish to npm
        if: env.DRY_RUN != 'true' && steps.npm-version-state.outputs.published != 'true'
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: npm publish "${TARBALL}" --provenance --access public

      - name: Report the npm state
        if: always() && env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHED: ${{ steps.npm-version-state.outputs.published }}
        run: |
          set -euo pipefail
          if [ "${PUBLISHED}" = "true" ]; then
            echo "::notice title=npm::${VERSION} was already published — the verify job still checks the published artifact."
          else
            echo "::notice title=npm::${VERSION} publish step completed."
          fi

  # --------------------------------------------------------------------
  # The published artifact, verified
  # --------------------------------------------------------------------
  # `check-pack` inspects the tarball this workflow built. It cannot see
  # the artifact a consumer receives: the v1.2.0 release published
  # nothing (the npm trusted publisher was not configured, so the publish
  # failed with E404) and the failure was discovered days later, by
  # reading the documentation. This job installs the published package
  # and runs it, so a broken artifact is a red workflow instead of a
  # support ticket.
  #
  # A failure here cannot un-publish the package: the response is to fix
  # the artifact and publish a patch version (`npm deprecate` the broken
  # one in the meantime).
  #
  # The job depends on `release` for the resolved version, not for the
  # publish: the publish step above is idempotent, so a version that is
  # already on the registry no longer fails the release job and no longer
  # takes this verification down with it. A published artifact is always
  # verified, however it got there.
  verify:
    name: Verify the published artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release
    # `env` is not available in a job-level `if`; the dispatch input is.
    if: github.ref_type == 'tag' && inputs.dry_run != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install and run the published package
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PACKAGE_NAME: dominus-oss
        run: |
          set -euo pipefail
          # The registry is eventually consistent: a package published a
          # minute ago may not be visible yet, so the verification retries.
          node scripts/verify-release.mjs \
            --package "${PACKAGE_NAME}@${VERSION}" \
            --expect-version "${VERSION}" \
            --retries 12 \
            --retry-delay 15000

  # The GitHub Release is the channel that works without an account setting,
  # so it is the channel a stranger uses. Until v1.3.4 it was the only
  # published channel and the only one no workflow verified: `verify` above
  # installs from npm, which had never been published at all.
  #
  # `always()` is deliberate: a failed npm publish must not skip the
  # verification of the channel users actually download. If the release job
  # died before attaching the assets, this job fails too - on the asset list.
  verify-github-release:
    name: Verify the GitHub Release channel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release
    if: always() && github.ref_type == 'tag' && inputs.dry_run != true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Assert the release carries the public channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "FATAL: the release job did not report a tag"
            exit 1
          fi
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in dominus-oss.tgz dominus-oss.tgz.sha256 install.sh install.ps1; do
            if ! grep -qx "$asset" <<<"$assets"; then
              echo "FATAL: $TAG does not carry $asset"
              echo "$assets"
              exit 1
            fi
          done
          echo "the release carries the alias tarball, its checksum and both installers"

      - name: Install from the public channel and run the first command
        run: |
          set -euo pipefail
          npm run check:published-install -- \
            --url "https://github.com/AlessioBrillo/dominus/releases/tag/${{ needs.release.outputs.tag }}"
