name: Security Scan

on:
  push:
    branches: [master]
    paths:
      - 'src/**/*.ts'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production dependencies)
        # High+ advisories in the production dependency tree fail the job.
        # Dev/build tooling is not shipped in the Docker image, so it is
        # omitted here and tracked via dependabot instead.
        run: npm audit --audit-level=high --omit=dev

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        # Only push events carry a before/after commit pair; on schedule and
        # workflow_dispatch BASE == HEAD and the action exits 183.
        # GitHub's native secret scanning covers the rest of the history.
        if: github.event_name == 'push'
        # Pinned to the v3.96.0 commit: trufflehog publishes no rolling `v3` tag.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          # --no-update is already injected by the action itself.
          extra_args: --results=verified,unknown

  docker-scan:
    name: Docker image scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # required to upload the Trivy SARIF report

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --target=api -t dominus-api:scan .

      - name: Run Trivy vulnerability scanner
        # Pinned to a fixed commit (supply-chain hardening): never track a
        # branch (`@master`) for third-party actions.
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: dominus-api:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: docker
