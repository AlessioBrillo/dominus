name: Trademark canary

# The trademark gate is the one feature the product cannot be without
# (Principle 6), and it depends on free public endpoints that are not ours:
# the USPTO search backend moved once already, and the failure mode was a
# `405` read as "this mark does not exist" until v1.3.2.
#
# The release workflow blocks a tag when the canary is red. This schedule
# catches drift between releases, when nobody is looking, and leaves an
# issue behind so the drift is not discovered by a user.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: The gate answers against the live registers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run the canary
        run: npm run check:trademarks

      - name: Open an issue when the canary is red
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Trademark canary is red: the gate cannot answer"
          body=$(printf '%s\n' \
            "The live trademark canary failed. The gate is fail-closed, so **no domain is recommended** until a source answers again." \
            "" \
            "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- What it checks: \`npm run check:trademarks\` (nike -> blocked, vintagecoffee -> clear)" \
            "- Runbook: docs/releases/launch-checklist.md, step 0" \
            "" \
            "This issue is opened automatically and closed by the next green run.")
          existing=$(gh issue list --state open --search "Trademark canary is red in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the issue when the canary is green
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "Trademark canary is red in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The live trademark canary is green again (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          fi
