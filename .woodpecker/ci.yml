# DOMINUS CI gate - Woodpecker (self-hosted).
#
# The authoritative gate runs locally with `ci-local` (this file, a throwaway
# copy) or on a Woodpecker server. GitHub Actions is a billing-blocked mirror;
# its badges are intentionally absent.
#
# Local run: ci-local            (default pipeline file .woodpecker/ci.yml)
# Server run: git push           (when a Woodpecker server is registered)
#
# The file speaks the syntax the local executor accepts: a root `steps`
# list, a root `services` list and per-step `volumes`. The previous version
# used the GitHub Actions key `working-directory` inside a command list,
# which is not valid YAML there, and a 2.x-only `clone`/`workspace` block:
# the file never parsed, so `ci-local` failed on the first read and the
# gate had never actually run. Every check of the previous version is
# preserved here; only the syntax changed:
#
#   - the per-command working directory became a `cd` in the command itself
#     (there is no per-command working directory);
#   - the PostgreSQL service moved to the root `services` list, where the
#     executor starts it, and the test step waits for it explicitly;
#   - the custom `workspace` and `clone` blocks were dropped: the default
#     workspace is the one the executor bind-mounts, and the default clone
#     is the one a server performs.
when:
  - event: [push, pull_request, manual]

services:
  # The PostgreSQL instance of the integration job. It is credential-free
  # on purpose: the tests run in a throwaway container and the tracked file
  # must not carry a credential-shaped URI (CLAUDE.md).
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: dominus

steps:
  # ------------------------------------------------------------------ static
  - name: static
    image: node:22-bookworm
    volumes:
      - ci-npm:/root/.npm
    commands:
      - git config --global --add safe.directory '*'
      - npm ci
      - npm run typecheck
      - npm run lint
      - npm run format:check
      - npm run db:sync:check
      - npm run check:sql-portability
      - npm run check:migration-compat
      - npm run notices:check
      - npm run adr:index:check
      - npm run check:doc-drift
      - npm run check:release-consistency
      - npm run check:workflows
      - npm run check:legal-placeholders
      - npm run check:image-pins
      # `release:verify -- --pack` lives in the pack step: it packs the
      # working tree and installs the tarball, so it needs the built
      # artifact (dist/) that only that step produces.

  # ------------------------------------------------------------------ backend
  - name: backend
    image: node:22-bookworm
    volumes:
      - ci-npm:/root/.npm
    commands:
      - git config --global --add safe.directory '*'
      - npm ci
      - npm run build
      - npm run test -- --coverage

  # ------------------------------------------------------------------ postgres (integration)
  # The same suite against a real PostgreSQL: the migrations, the
  # repositories and the tenant-scoped queries.
  - name: postgres
    image: node:22-bookworm
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/dominus
    volumes:
      - ci-npm:/root/.npm
    commands:
      - git config --global --add safe.directory '*'
      - until pg_isready -h postgres -U postgres -d dominus; do sleep 1; done
      - npm ci
      - npx tsx src/db/migrate-cli.ts
      - npx vitest run src/db src/__tests__ src/services src/api

  # ------------------------------------------------------------------ frontend
  - name: frontend
    image: node:22-bookworm
    volumes:
      - ci-frontend-npm:/root/.npm
    commands:
      - git config --global --add safe.directory '*'
      - cd frontend && npm ci
      - cd frontend && npm run typecheck
      - cd frontend && npm run lint
      - cd frontend && npm test
      - cd frontend && npm run build

  # ------------------------------------------------------------------ pack
  - name: pack
    image: node:22-bookworm
    volumes:
      - ci-npm:/root/.npm
    commands:
      - git config --global --add safe.directory '*'
      - npm ci
      - npm --prefix frontend ci
      - npm run build:frontend
      - npm run build
      - npm run check:pack
      - npm run release:verify -- --pack
      - npm run test:installers

  # ------------------------------------------------------------------ e2e smoke
  - name: e2e-smoke
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    environment:
      API_KEYS: ci-e2e-dummy-key
    volumes:
      - ci-npm:/root/.npm
    commands:
      - git config --global --add safe.directory '*'
      - npm ci
      - cd frontend && npm ci
      - cd frontend && npm run build:frontend
      - npm run build
      - node scripts/run-e2e-smoke.mjs

  # ------------------------------------------------------------------ trademark canary (daily + manual)
  - name: trademark-canary
    image: node:22-bookworm
    environment:
      EUIPO_CLIENT_ID: ${EUIPO_CLIENT_ID:-}
      EUIPO_CLIENT_SECRET: ${EUIPO_CLIENT_SECRET:-}
    volumes:
      - ci-npm:/root/.npm
    commands:
      - git config --global --add safe.directory '*'
      - npm ci
      - npm run check:trademarks
    when:
      - event: [cron, manual]

  # ------------------------------------------------------------------ terraform (IaC gate)
  # Terraform fmt + validate + cloud-init render run on every push/PR.
  # Credential-free: tfvars are gitignored and CI has no Hetzner token.
  # This is the gate parity step - the first apply runs the same HCL that CI
  # validates here.
  - name: terraform
    image: hashicorp/terraform:1.9.8
    volumes:
      - ci-npm:/root/.npm
    commands:
      - git config --global --add safe.directory '*'
      - cd deploy/terraform && terraform fmt -check -recursive
      - cd deploy/terraform && terraform init -backend=false
      - cd deploy/terraform && terraform validate

  # ------------------------------------------------------------------ deploy scripts (behavior tests)
  # rollout.sh, migrate.sh and migration-gate.sh run on the app node during
  # every Cloud deploy. These tests exercise the full roll / verify / health /
  # rollback state machine against a mocked stack - no live node required.
  # They must run in the gate that decides whether a release is cut.
  - name: deploy-scripts
    image: node:22-bookworm
    volumes:
      - ci-npm:/root/.npm
    commands:
      - git config --global --add safe.directory '*'
      - npm ci
      - bash scripts/deploy/test-rollout.sh
      - bash scripts/deploy/test-migrate.sh
      - bash scripts/deploy/test-migration-gate.sh
