# DOMINUS — Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dominus
  labels:
    app.kubernetes.io/component: server
spec:
  # Single replica is a hard constraint of the SQLite community edition:
  # the data volume is ReadWriteOnce, so a second pod would block in
  # ContainerCreating and the deployment would never become ready.
  # For multi-replica HA, run DOMINUS Cloud (set DATABASE_URL to
  # PostgreSQL) and increase replicas.
  replicas: 1
  strategy:
    type: RollingUpdate
    # maxSurge 0 + maxUnavailable 1: never run two pods on the RWO volume
    # simultaneously (unlike Recreate, the new pod must pass readiness
    # before rollout proceeds, so a broken image cannot take the service
    # permanently down).
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dominus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dominus
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # DOMINUS graceful shutdown: 5s drain + 25s grace = 30s. 45s gives
      # headroom so SIGKILL (default 30s grace) never preempts it.
      terminationGracePeriodSeconds: 45
      containers:
        - name: dominus
          image: ghcr.io/alessiobrillo/dominus:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dominus-config
            - secretRef:
                name: dominus-secrets
                optional: true
          env:
            - name: DATABASE_PATH
              value: /data/dominus.db
            - name: HOST
              value: 0.0.0.0
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dominus-data
        - name: tmp
          emptyDir: {}
