# DOMINUS — Prometheus configuration (production profile).
#
# Scrape targets:
#   api            — http://api:3000/api/v1/metrics/prometheus (Prometheus
#                    text format, unauthenticated by default, only reachable
#                    on the Docker network — never expose /metrics through
#                    the reverse proxy). When METRICS_TOKEN is configured on
#                    the API, uncomment the authorization block at the bottom
#                    of the dominus_api job so scraping keeps working.
#   redis-exporter — redis metrics via oliver006/redis_exporter (evictions,
#                    memory pressure) feeding the RedisDown and
#                    RedisEvictionsHigh alerts.
#   worker         — the worker exposes a loopback health server on 9090, but
#                    no /metrics endpoint; its liveness is inferred from the
#                    job queue gauges (queued jobs with no runner = alert
#                    fires)
#
# METRICS_TOKEN: when set on the API, the app-node Terraform module
# activates the authorization block below (marker lines) and renders the
# token file into the prometheus container — otherwise every scrape 401s
# and all alerting dies silently. Local compose operators do the same by
# hand: uncomment the block and write the token to ./prometheus/metrics-token.
#
# Rules are loaded from rules.yml (mounted read-only).

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: dominus

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: dominus_api
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ["api:3000"]
        labels:
          container: api
    # METRICS_TOKEN_RENDER:START
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics-token
    # METRICS_TOKEN_RENDER:END

  - job_name: redis
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          container: redis
