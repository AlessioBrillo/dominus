# DOMINUS — Prometheus alert rules (production profile).
#
# Tuned to the production profile: alert on things that break decisions
# (error rates, stuck queues, dead letters), not on noise.
# The webhook receiver is configured in alertmanager.yml.

groups:
  - name: dominus-api
    rules:
      - alert: ApiDown
        expr: up{job="dominus_api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DOMINUS API is unreachable"
          description: "Prometheus cannot scrape the API endpoint for 5 minutes."

      - alert: HighProviderErrorRate
        expr: |
          sum(rate(dominus_provider_errors_total[15m])) by (provider)
            / clamp_min(sum(rate(dominus_provider_calls_total[15m])) by (provider), 1)
            > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} error rate above 25%"
          description: "The {{ $labels.provider }} provider failed more than 25% of calls over 15 minutes."

      - alert: StageErrorsIncreasing
        expr: increase(dominus_stage_errors_total[30m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline stage {{ $labels.stage }} is failing"
          description: "Stage '{{ $labels.stage }}' recorded new errors in the last 30 minutes."

  - name: dominus-queue
    rules:
      - alert: QueueStuck
        expr: dominus_queue_queued > 0 and dominus_queue_running == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Job queue is stuck"
          description: "{{ $value }} jobs are queued but no worker is running them."

      - alert: QueueBacklog
        expr: dominus_queue_queued > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Job queue backlog"
          description: "{{ $value }} jobs are waiting; workers cannot keep up."

      - alert: DeadLetterJobs
        expr: increase(dominus_queue_dead_letter_total[1h]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Jobs entered the dead-letter queue"
          description: "One or more jobs exhausted their retries in the last hour."

  - name: dominus-cache
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis is unreachable"
          description: "Prometheus cannot scrape redis-exporter for 5 minutes."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory above 80%"
          description: "Redis is using {{ $value | humanizePercentage }} of its maxmemory (volatile-lru eviction will kick in)."

      - alert: RedisEvictionsHigh
        expr: increase(redis_evicted_keys_total[15m]) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High Redis eviction rate"
          description: "More than 1000 keys evicted in 15 minutes — check cache TTLs and rate-limit window sizes."

  - name: dominus-backup
    rules:
      - alert: BackupStale
        # The daily backup (04:00) feeds dominus_backup_last_success_timestamp
        # via BackupService.onSuccess. Absent success for >26h covers both a
        # failed dump and a dump that silently never ran (ADR-0054).
        expr: time() - dominus_backup_last_success_timestamp > 26 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No successful database backup in 26 hours"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago. The database may be unrecoverable."

      - alert: PitrArchivingDown
        expr: dominus_pitr_archiving_active == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL WAL archiving is not running"
          description: "The pitr-health check found no archived WAL segment — point-in-time recovery is silently unavailable."

      - alert: PitrWalLagHigh
        expr: dominus_pitr_wal_lag_bytes > 64 * 1024 * 1024
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL WAL archiving lag above 64MB"
          description: "{{ $value | humanize1024 }}B of WAL not yet archived — archives may be lost if the server dies."

      - alert: PitrBaseBackupStale
        expr: dominus_pitr_base_backup_age_hours > 26
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL base backup older than 26 hours"
          description: "The newest base backup is {{ $value }}h old — replay would need more than a day of WAL."
