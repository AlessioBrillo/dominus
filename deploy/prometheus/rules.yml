# DOMINUS — Prometheus alert rules (production profile).
#
# Tuned to the production profile: alert on things that break decisions
# (error rates, stuck queues, dead letters), not on noise.
# The webhook receiver is configured in alertmanager.yml.

groups:
  - name: dominus-dnssec
    rules:
      - alert: UnboundDnssecValidationLost
        expr: increase(dominus_unbound_dnssec_validation_lost_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Unbound DNSSEC validation LOST — val-permissive-mode or misconfiguration detected"
          description: "Periodic revalidation detected DNSSEC validation is no longer active on the Unbound resolver. This means the resolver may be accepting forged answers (val-permissive-mode: yes via rndc, or upstream forwarder failure). DNS verdicts are no longer trustworthy — investigate Unbound configuration immediately."

      - alert: UnboundDnssecValidationRecovered
        expr: increase(dominus_unbound_dnssec_validation_recovered_total[15m]) > 0
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Unbound DNSSEC validation REGAINED"
          description: "DNSSEC validation was previously lost and has now been restored. The resolver is once again rejecting bogus signatures. Monitor for flapping (repeated lost/recovered cycles)."

  - name: dominus-rdap-bootstrap
    rules:
      - alert: RdapBootstrapFailuresHigh
        expr: dominus_rdap_bootstrap_consecutive_failures > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "IANA RDAP bootstrap refresh failing repeatedly"
          description: "The IANA RDAP bootstrap has failed {{ $value }} consecutive times. The bootstrap cache is stale — RDAP lookups may route to wrong registries. Check egress to data.iana.org and the bootstrap URL."

      - alert: RdapBootstrapDown
        expr: dominus_rdap_bootstrap_ok == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "IANA RDAP bootstrap is down"
          description: "The last bootstrap refresh was unsuccessful. RDAP lookups are falling back to rdap.org routing which may be suboptimal or incorrect for some TLDs. Check network egress and IANA endpoint availability."

  - name: dominus-pipeline
    rules:
      - alert: PipelineRunDegraded
        expr: increase(dominus_pipeline_degraded_runs_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline run completed in degraded mode"
          description: "At least one pipeline run was flagged as degraded (stage timeout, error, or consensus unverifiable). Check degradedReasons in the run metadata — common causes: DNS budget exhaustion, RDAP consensus downgrades, Trademark gate failures."

      - alert: PipelineStageTimeoutHigh
        expr: |
          sum(rate(dominus_stage_timeout_total[15m])) by (stage)
            / clamp_min(sum(rate(dominus_stage_run_total[15m])) by (stage), 1)
            > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline stage {{ $labels.stage }} timeout rate above 10%"
          description: "More than 10% of {{ $labels.stage }} executions are hitting their budget timeout. Consider increasing STAGE_TIMEOUT_PER_CANDIDATE_MS or STAGE_TIMEOUT_CAP_MS for this stage."

  - name: dominus-backup
    rules:
      - alert: BackupStale
        # The daily backup (04:00) feeds dominus_backup_last_success_timestamp
        # via BackupService.onSuccess. Absent success for >26h covers both a
        # failed dump and a dump that silently never ran (ADR-0054).
        expr: time() - dominus_backup_last_success_timestamp > 26 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No successful database backup in 26 hours"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago. The database may be unrecoverable."

      - alert: PitrArchivingDown
        expr: dominus_pitr_archiving_active == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL WAL archiving is not running"
          description: "The pitr-health check found no archived WAL segment — point-in-time recovery is silently unavailable."

      - alert: PitrWalLagHigh
        expr: dominus_pitr_wal_lag_bytes > 64 * 1024 * 1024
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL WAL archiving lag above 64MB"
          description: "{{ $value | humanize1024 }}B of WAL not yet archived — archives may be lost if the server dies."

      - alert: PitrBaseBackupStale
        expr: dominus_pitr_base_backup_age_hours > 26
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL base backup older than 26 hours"
          description: "The newest base backup is {{ $value }}h old — replay would need more than a day of WAL."
