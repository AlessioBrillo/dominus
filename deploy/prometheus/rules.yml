# DOMINUS — Prometheus alert rules (production profile).
#
# Tuned to the production profile: alert on things that break decisions
# (error rates, stuck queues, dead letters), not on noise.
# The webhook receiver is configured in alertmanager.yml.

groups:
  - name: dominus-api
    rules:
      - alert: ApiDown
        expr: up{job="dominus_api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DOMINUS API is unreachable"
          description: "Prometheus cannot scrape the API endpoint for 5 minutes."

      - alert: HighProviderErrorRate
        expr: |
          sum(rate(dominus_provider_errors_total[15m])) by (provider)
            / clamp_min(sum(rate(dominus_provider_calls_total[15m])) by (provider), 1)
            > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} error rate above 25%"
          description: "The {{ $labels.provider }} provider failed more than 25% of calls over 15 minutes."

      - alert: StageErrorsIncreasing
        expr: increase(dominus_stage_errors_total[30m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline stage {{ $labels.stage }} is failing"
          description: "Stage '{{ $labels.stage }}' recorded new errors in the last 30 minutes."

      - alert: TrademarkGateUnverifiedHigh
        expr: |
          sum(rate(dominus_trademark_gate_unverified_total[15m]))
            / clamp_min(
                sum(
                  rate(dominus_trademark_gate_clear_total[15m])
                  + rate(dominus_trademark_gate_blocked_total[15m])
                  + rate(dominus_trademark_gate_unverified_total[15m])
                ),
                1
              )
            > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than half of trademark gate checks are Unverified"
          description: "{{ $value | humanizePercentage }} of trademark checks returned Unverified over 15 minutes — USPTO/EUIPO sources may be down (strict-TLD domains degrade to Unverified)."

  - name: dominus-queue
    rules:
      - alert: QueueStuck
        expr: dominus_queue_queued > 0 and dominus_queue_running == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Job queue is stuck"
          description: "{{ $value }} jobs are queued but no worker is running them."

      - alert: QueueBacklog
        expr: dominus_queue_queued > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Job queue backlog"
          description: "{{ $value }} jobs are waiting; workers cannot keep up."

      - alert: DeadLetterJobs
        expr: increase(dominus_queue_dead_letter_total[1h]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Jobs entered the dead-letter queue"
          description: "One or more jobs exhausted their retries in the last hour."

  - name: dominus-dns-slo
    rules:
      # SLO latency alerts (ADR-0064). The histograms are fed by the per-leg
      # DNS and per-request RDAP telemetry; quantiles are computed across
      # the aggregate (role/transport), not per endpoint, to avoid alert
      # noise on anycast wobble of a single resolver.

      - alert: DnsLegLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le, role, transport) (
              rate(dominus_dns_leg_duration_ms_bucket[15m])
            )
          ) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DNS {{ $labels.role }} leg p99 above 2s ({{ $labels.transport }})"
          description: "The p99 resolution time of the {{ $labels.role }} ({{ $labels.transport }}) opinion exceeded 2s for 10 minutes — verdicts are stalling near the 1.5s lookup timeout."

      - alert: RdapRequestLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le) (
              rate(dominus_rdap_request_duration_ms_bucket{outcome="ok"}[15m])
            )
          ) > 8000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RDAP request p99 above 8s"
          description: "The p99 RDAP request duration exceeded 8s for 10 minutes — registries are slow; consensus downgrades may surface as unverifiable verdicts."

      - alert: DnsBreakerOpen
        expr: dominus_dns_breaker_open > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DNS resolver endpoint circuit open"
          description: "{{ $value }} resolver endpoint(s) are being skipped by the circuit breaker — verdicts rely on the remaining legs (fail-closed, no fabricated Available)."

      - alert: DnsTertiaryBreakerOpen
        expr: dominus_dns_breaker_open{endpoint=~"opendns|digitale-gesellschaft"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DNS tertiary leg circuit open (OpenDNS or Digital Society)"
          description: "One of the two tertiary operators is being skipped by the circuit breaker — the 2-of-3 gate's third opinion is degraded to a single operator. If both open, the tertiary leg is effectively disabled (ADR-0065)."

      - alert: DnsTertiaryLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le, endpoint) (
              rate(dominus_dns_leg_duration_ms_bucket{role="tertiary"}[15m])
            )
          ) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DNS tertiary leg p99 above 2s ({{ $labels.endpoint }})"
          description: "The p99 resolution time of the tertiary opinion ({{ $labels.endpoint }}) exceeded 2s for 10 minutes — the rescue leg is stalling near the 1.5s lookup timeout and may fail to confirm Available verdicts."

      - alert: DnsDisjointnessResolutionPartial
        expr: increase(dominus_dns_disjointness_resolution_partial_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Boot-time consensus disjointness check ran without full DoH IP resolution"
          description: "The strongest overlap check (resolved-IP) degraded to hostname/operator hints at boot (ADR-0065) — the consensus gate was decided on partial evidence. A slow system resolver or changed DoH hostnames are the usual causes."

      # DNS Consensus Theater prevention (authoritative zone overlap detection)
      # These alerts fire when the consensus gate's verification legs share
      # authoritative nameservers with the primary — their "independent" opinion
      # is a rubber stamp of the same registry infrastructure (e.g., Verisign
      # for .com/.net). The gate silently accepts the primary verdict for
      # affected TLDs but records the overlap for observability.

      - alert: DnsConsensusOriginOverlapHigh
        expr: |
          sum(rate(dominus_dns_consensus_origin_overlap_total[15m]))
            / clamp_min(sum(rate(dominus_dns_consensus_verified_total[15m])), 1)
            > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DNS consensus origin overlap exceeds 50% of verified domains"
          description: "More than half of consensus-verified Available domains share authoritative zones with the primary leg — the 2-of-3 gate is ineffective for affected TLDs. Configure DNS_CONSENSUS_NAMESERVERS with a genuinely independent recursor."

      - alert: DnsConsensusOriginOverlapAny
        expr: increase(dominus_dns_consensus_origin_overlap_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DNS consensus detected authoritative zone overlap"
          description: "At least one Available verdict had its consensus skipped because the verification leg shares authoritative nameservers with the primary. The gate silently accepted the primary verdict (fail-open) but the consensus is a rubber stamp for affected TLDs. Immediate topology review required."

  - name: dominus-cache
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis is unreachable"
          description: "Prometheus cannot scrape redis-exporter for 5 minutes."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory above 80%"
          description: "Redis is using {{ $value | humanizePercentage }} of its maxmemory (volatile-lru eviction will kick in)."

      - alert: RedisEvictionsHigh
        expr: increase(redis_evicted_keys_total[15m]) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High Redis eviction rate"
          description: "More than 1000 keys evicted in 15 minutes — check cache TTLs and rate-limit window sizes."

  - name: dominus-backup
    rules:
      - alert: BackupStale
        # The daily backup (04:00) feeds dominus_backup_last_success_timestamp
        # via BackupService.onSuccess. Absent success for >26h covers both a
        # failed dump and a dump that silently never ran (ADR-0054).
        expr: time() - dominus_backup_last_success_timestamp > 26 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No successful database backup in 26 hours"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago. The database may be unrecoverable."

      - alert: PitrArchivingDown
        expr: dominus_pitr_archiving_active == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL WAL archiving is not running"
          description: "The pitr-health check found no archived WAL segment — point-in-time recovery is silently unavailable."

      - alert: PitrWalLagHigh
        expr: dominus_pitr_wal_lag_bytes > 64 * 1024 * 1024
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL WAL archiving lag above 64MB"
          description: "{{ $value | humanize1024 }}B of WAL not yet archived — archives may be lost if the server dies."

      - alert: PitrBaseBackupStale
        expr: dominus_pitr_base_backup_age_hours > 26
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL base backup older than 26 hours"
          description: "The newest base backup is {{ $value }}h old — replay would need more than a day of WAL."
