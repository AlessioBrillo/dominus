# Unbound configuration for DOMINUS (ADR-0072)
# CI version: plain DNS only on port 5300, no DoT listener, no forward-zone.

server:
  # Basic settings
  verbosity: 1
  interface: 0.0.0.0@5300
  interface: ::0@5300
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes

  # Control interface for unbound-control (health checks, metrics)
  control-enable: yes
  control-interface: 0.0.0.0@8953
  control-use-cert: no

  # Access control: only compose subnet + localhost
  access-control: 127.0.0.0/8 allow
  access-control: ::1 allow
  access-control: 172.21.0.0/24 allow

  # DNSSEC validation (ADR-0002 conservatism: fail-closed on bogus)
  val-permissive-mode: no
  val-log-level: 1
  val-clean-additional: yes
  val-sig-skew-min: 3600
  val-sig-skew-max: 86400

  # Aggressive NSEC caching (RFC 8198) — reduces queries to authoritative
  aggressive-nsec: yes

  # Performance tuning
  msg-cache-size: 64m
  rrset-cache-size: 128m
  num-threads: 2
  outgoing-range: 256
  so-rcvbuf: 4m
  so-sndbuf: 4m

  # Privacy: minimal logging, no query logging by default
  log-queries: no
  log-replies: no
  log-servfail: yes
  log-local-actions: no

  # Hardening
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  harden-referral-path: yes
  harden-algo-downgrade: yes
  deny-any: yes
  use-caps-for-id: yes
  private-address: 127.0.0.0/8
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: ::1/128
  private-address: fe80::/10
  private-address: fd00::/8

  # EDNS0 buffer size
  edns-buffer-size: 1232

  # Qname minimisation (RFC 7816)
  qname-minimisation: yes

  # Statistics
  statistics-interval: 0
  statistics-cumulative: yes
  extended-statistics: yes

# Remote control (for unbound-control)
remote-control:
  control-enable: yes
  control-interface: 0.0.0.0@8953
  control-use-cert: no