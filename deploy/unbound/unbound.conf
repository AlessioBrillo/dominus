# Unbound configuration for DOMINUS (ADR-0072)
# Single recursive resolver with DNSSEC validation and DoT upstream.
#
# This configuration provides:
# - Full DNSSEC validation (val-permissive-mode: no)
# - DNS-over-TLS upstream (tls-upstream: yes) to Cloudflare, Google, Quad9
# - DoT listener on port 853 for application queries
# - Control interface on port 8953 for health checks and metrics
# - Access control restricted to compose subnet (172.21.0.0/24)
# - Aggressive NSEC caching for performance
# - Root hints auto-fetch

server:
  # Basic settings
  verbosity: 1
  interface: 0.0.0.0@5300
  interface: ::0@5300
  interface: 0.0.0.0@853
  interface: ::0@853
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes

  # TLS/SSL for DoT
  tls-service-key: "/opt/unbound/tls/unbound.key"
  tls-service-pem: "/opt/unbound/tls/unbound.pem"
  tls-port: 853
  tls-upstream: yes

  # Control interface for unbound-control (health checks, metrics)
  control-enable: yes
  control-interface: 0.0.0.0@8953
  control-use-cert: no

  # Access control: only compose subnet + localhost
  access-control: 127.0.0.0/8 allow
  access-control: ::1 allow
  access-control: 172.21.0.0/24 allow

  # DNSSEC validation (ADR-0002 conservatism: fail-closed on bogus)
  val-permissive-mode: no
  val-log-level: 1
  val-clean-additional: yes
  val-sig-skew-min: 3600
  val-sig-skew-max: 86400

  # Aggressive NSEC caching (RFC 8198) — reduces queries to authoritative
  aggressive-nsec: yes

  # Root hints auto-fetch (RFC 8109)
  root-hints: "/opt/unbound/root.hints"
  auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"

  # Performance tuning
  msg-cache-size: 64m
  rrset-cache-size: 128m
  num-threads: 2
  outgoing-range: 256
  so-rcvbuf: 4m
  so-sndbuf: 4m

  # Privacy: minimal logging, no query logging by default
  log-queries: no
  log-replies: no
  log-servfail: yes
  log-local-actions: no

  # Hardening
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  harden-referral-path: yes
  harden-algo-downgrade: yes
  deny-any: yes
  use-caps-for-id: yes
  private-address: 127.0.0.0/8
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: ::1/128
  private-address: fe80::/10
  private-address: fd00::/8

  # DoT upstream forwarders (fallback when authoritative fails)
  # Cloudflare (1.1.1.1, 1.0.0.1) - privacy-first, TLS 1.3
  forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 8.8.8.8@853#dns.google
    forward-addr: 8.8.4.4@853#dns.google
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-first: no  # Try authoritative first, forward only on failure

  # EDNS0 buffer size
  edns-buffer-size: 1232

  # Qname minimisation (RFC 7816)
  qname-minimisation: yes

  # Response policy zones (optional, for blocking known bad domains)
  # rpz: /opt/unbound/rpz.conf

  # Statistics
  statistics-interval: 0
  statistics-cumulative: yes
  extended-statistics: yes

# Remote control (for unbound-control)
remote-control:
  control-enable: yes
  control-interface: 0.0.0.0@8953
  control-use-cert: no
  server-key-file: "/opt/unbound/tls/unbound_server.key"
  server-cert-file: "/opt/unbound/tls/unbound_server.pem"
  control-key-file: "/opt/unbound/tls/unbound_control.key"
  control-cert-file: "/opt/unbound/tls/unbound_control.pem"