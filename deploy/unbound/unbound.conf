# Unbound configuration for DOMINUS (ADR-0072)
# CI version: minimal plain DNS only on port 5300

server:
  verbosity: 1
  interface: 0.0.0.0@5300
  interface: ::0@5300
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes

  # Control interface for health checks
  control-enable: yes
  control-interface: 0.0.0.0@8953
  control-use-cert: no

  # Access control: allow all for CI
  access-control: 0.0.0.0/0 allow
  access-control: ::0/0 allow

  # DNSSEC validation
  val-permissive-mode: no
  val-log-level: 1

  # Performance tuning
  msg-cache-size: 64m
  rrset-cache-size: 128m
  num-threads: 2

  # Privacy: minimal logging
  log-queries: no
  log-replies: no

  # Hardening
  harden-glue: yes
  harden-dnssec-stripped: yes
  deny-any: yes
  use-caps-for-id: yes

  # EDNS0 buffer size
  edns-buffer-size: 1232

  # Qname minimisation (RFC 7816)
  qname-minimisation: yes