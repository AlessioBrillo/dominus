# Unbound recursive resolver for the DOMINUS DNS 2-of-3 consensus secondary
# (ADR-0042 / C3 of the cloud hardening review).
#
# Acts as a private, co-hosted recursor so the consensus gate has a genuinely
# independent opinion without depending on egress TCP/853 to public DoT
# providers (which the default 'dot-only' strategy would need).
#
# Binds on the container bridge (0.0.0.0:5300) and is reachable from the
# app/worker/scheduler containers via the fixed address 172.20.0.10 — see
# docker-compose.dns-consensus.yml. Access is restricted to the loopback
# and the 172.20.0.0/24 compose subnet.

server:
  verbosity: 1
  # Bind all interfaces inside the container; port restricted by the
  # container's exposed port (5300). The subnet ACL keeps it private.
  interface: 0.0.0.0
  port: 5300
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes
  prefer-ip6: no
  hide-identity: yes
  hide-version: yes
  # Recursively resolve from the root; no upstream forwarding, so the opinion
  # stays independent of the primary provider's DoH/DoT endpoints.
  access-control: 127.0.0.0/8 allow
  access-control: ::1/128 allow
  access-control: 172.20.0.0/24 allow

  # Remote control on loopback so the container healthcheck (and debugging)
  # can query status without certificates.
  remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no

  # Resolver hygiene
  qname-minimisation: yes
  prefetch: yes
  prefetch-key: yes
  do-not-query-localhost: no
  harden-short-bufsize: no
  cache-max-ttl: 3600
  msg-cache-size: 16m
  rrset-cache-size: 32m
  num-threads: 2

  # DNSSEC validation is best-effort: a failed trust anchor should not take
  # the whole consensus gate down, but valid signed answers are still verified.
  val-log-level: 1