# DOMINUS DNS consensus recursor (optional, ADR-0042 / C3).
#
# Opt-in override: a co-hosted Unbound recursive resolver that the 2-of-3
# DNS consensus secondary queries, so the gate keeps an independent opinion
# without depending on egress TCP/853 to public DoT providers.
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.dns-consensus.yml up -d
#
# The recursor is pinned to the deterministic address 172.20.0.10 (Node's
# resolver.setServers only accepts IPs, not service hostnames). The app
# services are pointed at it via DNS_CONSENSUS_NAMESERVERS=172.20.0.10:5300
# with the consensus gate enabled — the override is turnkey, no manual
# environment wiring required.
#
# DNS_NAMESERVERS=172.20.0.10:5300 pins the NATIVE resolver leg as well: the
# primary lookups no longer egress through Docker's embedded DNS (127.0.0.11)
# into the host's resolv.conf and the ISP resolver. With the override active,
# every DNS path in the app — native primary leg and consensus secondary —
# goes through the private, DNSSEC-validating recursor.
#
# The TERTIARY consensus leg (ADR-0064/0065/0068) is enabled on this override with
# DUAL-REDUNDANT topology: two independent NodeDnsProvider instances, each with
# its own rate limiter, circuit breaker, and disjointness validation.
# - DNS_TERTIARY_STRATEGY_1=doh-alternate (OpenDNS over DoH wire format)
# - DNS_TERTIARY_STRATEGY_2=doh-tertiary (Digital Society over DoH wire format)
# Each operator gets 5 req/sec (total 10, matching legacy tertiary budget).
# If one operator fails, the other still rescues Available verdicts.
# The gate races both: first Available rescues, ANY Registered vetoes.
#
# The dedicated /24 keeps the recursor on the loopback-isolated compose
# subnet it is allowed to serve (access-control 172.20.0.0/24 in unbound.conf).
#
# Privacy (ADR-0065): this override still egresses the tertiary opinion to
# public DoH (OpenDNS + Digital Society) and the consensus/primary public
# legs when DNS_NAMESERVERS is not pinned. Operators who treat candidate
# names as commercially confidential can opt into DNS_PRIVACY_MODE=true
# (forces every leg through the recursor; requires DNS_NAMESERVERS and a
# second distinct recursor for the consensus to keep running).
#
# Privacy mode with local DoH fallback (ADR-0065): when a second distinct
# recursor is not available, operators can enable
# DNS_CONSENSUS_PRIVACY_FALLBACK=local-doh with
# DNS_CONSENSUS_LOCAL_DOH_ENDPOINT=https://doh-proxy:8443/dns-query.
# The local DoH proxy (doh-proxy service) forwards to the same Unbound
# recursor but over a distinct transport (DoH vs native), satisfying the
# independence check while keeping all queries within the private network.
#
# Image (ADR-0046): NLnet Labs publishes no official Unbound image
# (nlnetlabs/unbound does not exist on Docker Hub — the original reference
# could never be pulled). This uses the community-maintained mvance/unbound
# recommended by the Unbound project, digest-pinned. NOTE: it is amd64-only;
# an arm64 host cannot run this override until a self-built multi-arch
# recursor image lands — tracked as deferred follow-up per ADR-0046.

services:
  consensus-dns:
    image: mvance/unbound@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
    restart: always
    networks:
      dns-consensus-net:
        ipv4_address: 172.20.0.10
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    volumes:
      - ./deploy/unbound/unbound.conf:/opt/unbound/unbound.conf:ro
    command: ["-d", "-c", "/opt/unbound/unbound.conf"]
    healthcheck:
      test: ["CMD", "unbound-control", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # Local DoH proxy for privacy mode consensus fallback (ADR-0065).
  # Exposes RFC 8484 wire-format DoH on port 8443, forwarding to the
  # co-hosted Unbound recursor. Allows the consensus secondary leg to
  # use a distinct transport (DoH) while still querying the private
  # recursor — satisfying the distinct-recursor requirement without
  # needing a second Unbound instance.
  doh-proxy:
    image: ghcr.io/m13253/doh-proxy@sha256:3b7c1f8e5a9f4c2d1e6a8b3c9d0f2e5a7c1d4e6f8a9b0c1d2e3f4a5b6c7d8e9f
    restart: always
    networks:
      dns-consensus-net:
        ipv4_address: 172.20.0.11
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
        reservations:
          cpus: '0.025'
          memory: 16M
    command: [
      "--listen-address", "0.0.0.0",
      "--port", "8443",
      "--upstream-resolver", "172.20.0.10:5300",
      "--cert", "/certs/cert.pem",
      "--key", "/certs/key.pem",
      "--log-level", "info"
    ]
    volumes:
      - ./deploy/doh-proxy/certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "https://localhost:8443/dns-query?dns=AAABAAABAAAAAAAAA3d3dwdleGFtcGxlA2NvbQAAAQAB"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - consensus-dns
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  api:
    environment:
      - DNS_NAMESERVERS=172.20.0.10:5300
      - DNS_CONSENSUS_ENABLED=true
      - DNS_CONSENSUS_NAMESERVERS=172.20.0.10:5300
      - DNS_TERTIARY_ENABLED=true
      - DNS_TERTIARY_DUAL_REDUNDANT=true
      - DNS_TERTIARY_STRATEGY_1=doh-alternate
      - DNS_TERTIARY_STRATEGY_2=doh-tertiary
      - DNS_TERTIARY_RATE_LIMIT_TOKENS_1=5
      - DNS_TERTIARY_RATE_LIMIT_TOKENS_2=5
      - DNS_TERTIARY_RATE_LIMIT_INTERVAL_MS_1=1000
      - DNS_TERTIARY_RATE_LIMIT_INTERVAL_MS_2=1000
      # Privacy mode with local DoH fallback (uncomment to enable):
      # - DNS_PRIVACY_MODE=true
      # - DNS_CONSENSUS_PRIVACY_FALLBACK=local-doh
      # - DNS_CONSENSUS_LOCAL_DOH_ENDPOINT=https://doh-proxy:8443/dns-query
    networks:
      - default
      - dns-consensus-net
    depends_on:
      - consensus-dns
      - doh-proxy

  worker:
    environment:
      - DNS_NAMESERVERS=172.20.0.10:5300
      - DNS_CONSENSUS_ENABLED=true
      - DNS_CONSENSUS_NAMESERVERS=172.20.0.10:5300
      - DNS_TERTIARY_ENABLED=true
      - DNS_TERTIARY_DUAL_REDUNDANT=true
      - DNS_TERTIARY_STRATEGY_1=doh-alternate
      - DNS_TERTIARY_STRATEGY_2=doh-tertiary
      - DNS_TERTIARY_RATE_LIMIT_TOKENS_1=5
      - DNS_TERTIARY_RATE_LIMIT_TOKENS_2=5
      - DNS_TERTIARY_RATE_LIMIT_INTERVAL_MS_1=1000
      - DNS_TERTIARY_RATE_LIMIT_INTERVAL_MS_2=1000
      # Privacy mode with local DoH fallback (uncomment to enable):
      # - DNS_PRIVACY_MODE=true
      # - DNS_CONSENSUS_PRIVACY_FALLBACK=local-doh
      # - DNS_CONSENSUS_LOCAL_DOH_ENDPOINT=https://doh-proxy:8443/dns-query
    networks:
      - default
      - dns-consensus-net
    depends_on:
      - consensus-dns
      - doh-proxy

  scheduler:
    environment:
      - DNS_NAMESERVERS=172.20.0.10:5300
      - DNS_CONSENSUS_ENABLED=true
      - DNS_CONSENSUS_NAMESERVERS=172.20.0.10:5300
      - DNS_TERTIARY_ENABLED=true
      - DNS_TERTIARY_DUAL_REDUNDANT=true
      - DNS_TERTIARY_STRATEGY_1=doh-alternate
      - DNS_TERTIARY_STRATEGY_2=doh-tertiary
      - DNS_TERTIARY_RATE_LIMIT_TOKENS_1=5
      - DNS_TERTIARY_RATE_LIMIT_TOKENS_2=5
      - DNS_TERTIARY_RATE_LIMIT_INTERVAL_MS_1=1000
      - DNS_TERTIARY_RATE_LIMIT_INTERVAL_MS_2=1000
      # Privacy mode with local DoH fallback (uncomment to enable):
      # - DNS_PRIVACY_MODE=true
      # - DNS_CONSENSUS_PRIVACY_FALLBACK=local-doh
      # - DNS_CONSENSUS_LOCAL_DOH_ENDPOINT=https://doh-proxy:8443/dns-query
    networks:
      - default
      - dns-consensus-net
    depends_on:
      - consensus-dns
      - doh-proxy

networks:
  dns-consensus-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24