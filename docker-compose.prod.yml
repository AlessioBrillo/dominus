# DOMINUS — Production Docker Compose profile.
# Extends the base compose.yml for production deployments.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Override with your own .env file:
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Image pinning:
#   The Deploy workflow publishes `master`, `sha-<commit>` and `vX.Y.Z`
#   tags (plus -worker/-scheduler variants). The default resolves to
#   `master` for convenience; pin DOMINUS_IMAGE_TAG to a sha tag for
#   immutable production rollouts:
#     DOMINUS_IMAGE_TAG=sha-6f4b3c2a1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a
#
# Backups:
#   A dedicated `backups` volume keeps backups off the disk that holds
#   dominus.db (same host, but isolated from DB write amplification and
#   from accidental wipe of ./data). For true off-disk durability, mount
#   the Hetzner Volume (or any external drive) instead — see
#   docs/deployment/README.md.

services:
  api:
    image: ghcr.io/alessiobrillo/dominus:${DOMINUS_IMAGE_TAG:-master}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "dist/app/healthcheck-cli.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/alessiobrillo/dominus:${DOMINUS_IMAGE_TAG:-master}-worker
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    volumes:
      - backups:/backups
    environment:
      - BACKUP_DIR=/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    image: ghcr.io/alessiobrillo/dominus:${DOMINUS_IMAGE_TAG:-master}-scheduler
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    volumes:
      - backups:/backups
    environment:
      - BACKUP_DIR=/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backups: