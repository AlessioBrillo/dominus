# DOMINUS — Docker Compose for development and community deployment.
#
# Community edition (SQLite, single-user): all services start by default.
#   docker compose up -d
#
# DOMINUS Cloud (PostgreSQL, multi-tenant): use the production overlay,
# which adds postgres, redis and the monitoring stack:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Production (with .env file for secrets):
#   docker compose --env-file .env up -d
#
# Service note:
#   api + worker + scheduler start by default — the job-queue worker and
#   the background scheduler are required for async runs, backups and
#   renewal checks (ADR-0023). This file intentionally has no
#   PostgreSQL/Redis: the community edition runs on SQLite at €0 infra
#   cost. The production overlay adds the data stores and monitoring.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: dominus-api:latest
    container_name: dominus-api
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./data/weights-override.json:/app/data/weights-override.json:ro
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_PATH=/app/data/dominus.db
      - DATABASE_URL=${DATABASE_URL:-}
      - PORT=${PORT:-3000}
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_PRETTY=${LOG_PRETTY:-false}
      - KEYWORD_DATA_PATH=${KEYWORD_DATA_PATH:-}
      - COMPS_DATA_PATH=${COMPS_DATA_PATH:-}
      - EUIPO_CLIENT_ID=${EUIPO_CLIENT_ID:-}
      - EUIPO_CLIENT_SECRET=${EUIPO_CLIENT_SECRET:-}
      - USPTO_SEARCH_URL=${USPTO_SEARCH_URL:-}
      - EUIPO_AUTH_URL=${EUIPO_AUTH_URL:-}
      - EUIPO_API_URL=${EUIPO_API_URL:-}
      - TM_CACHE_TTL_DAYS=${TM_CACHE_TTL_DAYS:-7}
      - SCORING_WEIGHTS_OVERRIDE=${SCORING_WEIGHTS_OVERRIDE:-}
      - DNS_BULK_CONCURRENCY=${DNS_BULK_CONCURRENCY:-10}
      - WHOIS_LOOKUP_TIMEOUT=${WHOIS_LOOKUP_TIMEOUT:-10000}
      - BUY_MAX_ABSOLUTE_CAP=${BUY_MAX_ABSOLUTE_CAP:-500}
      - FRONTEND_DIST_PATH=./frontend/dist
      - DROP_SCORE_THRESHOLD=${DROP_SCORE_THRESHOLD:-25}
      - DROP_RENEWAL_HORIZON_DAYS=${DROP_RENEWAL_HORIZON_DAYS:-60}
      - WORKER_ENABLED=false
      - SCHEDULER_ENABLED=false
      - REDIS_URL=${REDIS_URL:-}
      - PURCHASE_AUTO_APPROVAL=${PURCHASE_AUTO_APPROVAL:-never}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: dominus-worker:latest
    container_name: dominus-worker
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_PATH=/app/data/dominus.db
      - DATABASE_URL=${DATABASE_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - KEYWORD_DATA_PATH=${KEYWORD_DATA_PATH:-}
      - COMPS_DATA_PATH=${COMPS_DATA_PATH:-}
      - EUIPO_CLIENT_ID=${EUIPO_CLIENT_ID:-}
      - EUIPO_CLIENT_SECRET=${EUIPO_CLIENT_SECRET:-}
      - USPTO_SEARCH_URL=${USPTO_SEARCH_URL:-}
      - EUIPO_AUTH_URL=${EUIPO_AUTH_URL:-}
      - EUIPO_API_URL=${EUIPO_API_URL:-}
      - TM_CACHE_TTL_DAYS=${TM_CACHE_TTL_DAYS:-7}
      - SCORING_WEIGHTS_OVERRIDE=${SCORING_WEIGHTS_OVERRIDE:-}
      - DNS_BULK_CONCURRENCY=${DNS_BULK_CONCURRENCY:-10}
      - WHOIS_LOOKUP_TIMEOUT=${WHOIS_LOOKUP_TIMEOUT:-10000}
      - BUY_MAX_ABSOLUTE_CAP=${BUY_MAX_ABSOLUTE_CAP:-500}
      - DROP_SCORE_THRESHOLD=${DROP_SCORE_THRESHOLD:-25}
      - DROP_RENEWAL_HORIZON_DAYS=${DROP_RENEWAL_HORIZON_DAYS:-60}
      - WORKER_ENABLED=true
      - SCHEDULER_ENABLED=false
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - JOB_QUEUE_POLL_INTERVAL_MS=${JOB_QUEUE_POLL_INTERVAL_MS:-1000}
      - REDIS_URL=${REDIS_URL:-}
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    image: dominus-scheduler:latest
    container_name: dominus-scheduler
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_PATH=/app/data/dominus.db
      - DATABASE_URL=${DATABASE_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - KEYWORD_DATA_PATH=${KEYWORD_DATA_PATH:-}
      - COMPS_DATA_PATH=${COMPS_DATA_PATH:-}
      - EUIPO_CLIENT_ID=${EUIPO_CLIENT_ID:-}
      - EUIPO_CLIENT_SECRET=${EUIPO_CLIENT_SECRET:-}
      - USPTO_SEARCH_URL=${USPTO_SEARCH_URL:-}
      - EUIPO_AUTH_URL=${EUIPO_AUTH_URL:-}
      - EUIPO_API_URL=${EUIPO_API_URL:-}
      - TM_CACHE_TTL_DAYS=${TM_CACHE_TTL_DAYS:-7}
      - SCORING_WEIGHTS_OVERRIDE=${SCORING_WEIGHTS_OVERRIDE:-}
      - DNS_BULK_CONCURRENCY=${DNS_BULK_CONCURRENCY:-10}
      - WHOIS_LOOKUP_TIMEOUT=${WHOIS_LOOKUP_TIMEOUT:-10000}
      - BUY_MAX_ABSOLUTE_CAP=${BUY_MAX_ABSOLUTE_CAP:-500}
      - DROP_SCORE_THRESHOLD=${DROP_SCORE_THRESHOLD:-25}
      - DROP_RENEWAL_HORIZON_DAYS=${DROP_RENEWAL_HORIZON_DAYS:-60}
      - WORKER_ENABLED=false
      - SCHEDULER_ENABLED=true
      - SCHEDULER_BACKUP_CRON=${SCHEDULER_BACKUP_CRON:-0 4 * * *}
      - SCHEDULER_PRUNE_CRON=${SCHEDULER_PRUNE_CRON:-0 5 * * 0}
      - BACKUP_DIR=/app/data/backups
      - REDIS_URL=${REDIS_URL:-}
    restart: unless-stopped
